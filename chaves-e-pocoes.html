    const step = s.speed*dt; s.x += s.dx*step; s.y += s.dy*step; s.dist += step;
    safe(s.onMove, s, API, dt);
    if (grab && Math.hypot(s.x-grab.hx, s.y-grab.hy) < .9) cutGrab(CUSTOM.nome);
    for (const e of enemies){

      if (Math.hypot(e.x-s.x, e.y-s.y) < s.radius + ext(e)){

    if (s.done){ safe(s.onEnd, s, API); continue; }
    if (s.dist >= s.range || !API.inBounds(s.x,s.y)){

      else { s.done = true; safe(s.onEnd, s, API); }
    }
  }
  shots = shots.filter(s => !s.done);
  for (const tm of ptimers){
    tm.t += dt; safe(tm.tick, dt, API, Math.min(1, tm.t/tm.dur));
    if (tm.t >= tm.dur){ tm.done = true; safe(tm.end, API); }
  }
  ptimers = ptimers.filter(tm => !tm.done);
  for (const r of prings) r.t += dt;

// ---------- poderes ----------
function aimDir(){
  if (grab){ const dx = grab.hx-P.x, dy = grab.hy-P.y, l = Math.hypot(dx,dy); if (l>.1) return [dx/l, dy/l]; }

function useAbility(){
  if (P.cd>0 || P.dead) return;
  const pw = POWERS[powerOf()];
  if (pw){ P.cd = clamp(+pw.cd || 3, 1, 12); safe(pw.use, API); return; }
  if (powerOf()==='gloower'){ if (zip || grab) return; dismount('rest'); throwZip(); }
  else if (powerOf()==='caio'){ if (boom) return; const [dx,dy] = aimDir(); boom = {x:P.x, y:P.y, dx, dy, t:0, phase:'out', spin:0}; SFX.jump(); }
  else { if (tri) return; const [dx,dy] = aimDir(); tri = {x:P.x, y:P.y, dx, dy, dist:0, t:0, stuck:0}; P.cd = 2.5; SFX.warn(); }
}
function cutGrab(who){

function cutLashes(x, y){

function throwZip(){
  let a = Math.atan2(P.dy, P.dx);
  const oops = Math.random() < .3;
  a += oops ? (Math.random()<.5?-1:1)*rnd(.35,.6) : rnd(-.08,.08);
  let tx = P.x, ty = P.y;
  for (let s=.25; s<=5.5; s+=.25){
    const nx = P.x+Math.cos(a)*s, ny = P.y+Math.sin(a)*s;
    if (nx<.3 || ny<.3 || nx>W-.3 || ny>H-.3) break;
    if (chests.some(c => Math.hypot(c.x-nx, c.y-ny) < .7)) break;
    tx = nx; ty = ny;
  }
  zip = {phase:'throw', sx:P.x, sy:P.y, tx, ty, hx:P.x, hy:P.y, t:0, oops};
  P.cd = 3.5; SFX.jump();
}
function updateZip(dt){
  const z = zip; z.t += dt;
  if (z.phase==='throw'){
    const k = Math.min(1, z.t/.22);
    z.hx = z.sx + (z.tx-z.sx)*k; z.hy = z.sy + (z.ty-z.sy)*k;
    hitEnemies(z.hx, z.hy);
    if (k>=1){
      z.phase = 'ride'; z.t = 0; z.sx = P.x; z.sy = P.y;
      z.dur = Math.max(.15, Math.hypot(z.tx-P.x, z.ty-P.y)/12);
      burst(z.tx, z.ty, 4, '#cfd6e2', 10, 90);
      if (z.oops) toast('Ops! Gloower errou a mira.');
    }
  } else {
    const k = Math.min(1, z.t/z.dur);
    P.x = z.sx + (z.tx-z.sx)*k; P.y = z.sy + (z.ty-z.sy)*k; P.z = 1; P.vz = 0;
    if (k>=1){ zip = null; P.vz = 1.5; }
  }
}
function updateBoom(dt){

  if (b.phase==='out'){

    if (b.t>.42 || b.x<.2 || b.y<.2 || b.x>W-.2 || b.y>H-.2) b.phase = 'back';
  } else {
    const vx = P.x-b.x, vy = P.y-b.y, l = Math.hypot(vx,vy);

  if (grab && Math.hypot(b.x-grab.hx, b.y-grab.hy) < 1) cutGrab('Caio');
  cutLashes(b.x, b.y); hitEnemies(b.x, b.y);

function updateTri(dt){
  const t = tri; if (!t) return;

  if (grab && Math.hypot(t.x-grab.hx, t.y-grab.hy) < 1) cutGrab('Barry');

function update(dt){
  P.inv = Math.max(0, P.inv-dt); P.jcd = Math.max(0, P.jcd-dt);
  eff.speed = Math.max(0, eff.speed-dt); eff.slow = Math.max(0, eff.slow-dt); eff.jump = Math.max(0, eff.jump-dt);
  for (const c of chests){ c.nokeyT = Math.max(0, c.nokeyT-dt); if (c.open) c.openT += dt; }
  timeStop = Math.max(0, timeStop-dt); S.glacial = Math.max(0, (S.glacial||0)-dt); P.ultraGlow = Math.max(0, (P.ultraGlow||0)-dt);

  if (swing){ swing.t += dt; if (swing.t>.22) swing = null; }
  updateLashes(dt); updateBoom(dt); updateTri(dt);

  if (abilityPressed){ abilityPressed = false; useAbility(); }
  if (ability2Pressed){ ability2Pressed = false; useAbility2(); }
  if (ultraPressed){ ultraPressed = false; useUltra(); }
  if (poisonPressed){ poisonPressed = false; throwPoison(); }
  if (attackPressed){ attackPressed = false; if (!grab && !zip) basicAttack(); }
  if (ridePressed){ ridePressed = false; if (P.mount){ const fm = P.mount.form; dismount('rest'); toast(fm ? 'Você voltou ao normal.' : 'Você desceu do Lambery.'); } }
  if (grab){ updateGrab(dt); jumpPressed = false; return; }

  // movimento relativo à tela
  const kd = c => keysDown.has(c);
  const ix = ((kd('ArrowRight')||kd('KeyD'))?1:0) - ((kd('ArrowLeft')||kd('KeyA'))?1:0) + joy.x;
  const iy = ((kd('ArrowDown')||kd('KeyS'))?1:0) - ((kd('ArrowUp')||kd('KeyW'))?1:0) + joy.y;
  const gx = ix + 2*iy, gy = 2*iy - ix, gl = Math.hypot(gx,gy);
  const onArena = tileAt(P.x,P.y)===2;
  let sp = 4.2 * (eff.speed>0?1.55:1) * (eff.slow>0?.55:1) * (S.L.slow||1);
  if (P.mount) sp *= 1.35;
  if (S.L.world && SV.energia<=0) sp *= .6;
  if (P.z>0) sp *= 1.6; else if (onArena) sp *= P.mount ? .35 : .22;
  let tvx = 0, tvy = 0;
  if (gl>.05){
    P.dx = gx/gl; P.dy = gy/gl; tvx = P.dx*sp; tvy = P.dy*sp; P.walk += dt*sp*2.2;
    const sxd = P.dx - P.dy; if (Math.abs(sxd)>.05) P.face = sxd>0 ? 1 : -1;
  }
  const grip = (S.L.ice && P.z<=0 && !onArena) ? Math.min(1, dt*2.2) : 1;
  P.vx += (tvx-P.vx)*grip; P.vy += (tvy-P.vy)*grip;
  if (zip){ P.vx = P.vy = 0; updateZip(dt); }
  else {
    let nx = P.x + P.vx*dt, ny = P.y + P.vy*dt;
    if (P.z<.5 && tileAt(nx,ny)===4 && tileAt(P.x,P.y)!==4){ // não dá para nadar no mar
      if (tileAt(nx,P.y)!==4) ny = P.y; else if (tileAt(P.x,ny)!==4) nx = P.x; else { nx = P.x; ny = P.y; }
    }

      const a = inPen(p, P.x, P.y), b2 = inPen(p, nx, ny);
      if (a !== b2){ const porteira = Math.abs(nx-(p.x0+3.5)) < .5 && Math.abs(ny-(p.y0+p.h)) < .7; if (!porteira){ nx = P.x; ny = P.y; } }
    }

      if (tileAt(nx,P.y)!==1) ny = P.y; else if (tileAt(P.x,ny)!==1) nx = P.x; else { nx = P.x; ny = P.y; }

  }

    burst(P.x, P.y, 20, '#ffc9b0', 14, 120);

    }
  }

  if (S.L.world && P.z<.6){
    for (const c of (S.cityColl||[])){ const dx = P.x-c.x, dy = P.y-c.y, d = Math.hypot(dx,dy); if (d<c.r && d>0){ P.x = c.x+dx/d*c.r; P.y = c.y+dy/d*c.r; } }
    for (const n of nodes){ if (n.gone || !NODE[n.type].solid) continue; const dx = P.x-n.x, dy = P.y-n.y, d = Math.hypot(dx,dy); if (d<.5 && d>0){ P.x = n.x+dx/d*.5; P.y = n.y+dy/d*.5; } }
    for (const b of SV.builds){ const r = BUILDS[b.type].r; if (!r) continue; const dx = P.x-b.x, dy = P.y-b.y, d = Math.hypot(dx,dy); if (d<r && d>0){ P.x = b.x+dx/d*r; P.y = b.y+dy/d*r; } }
  }
  // lava e arena
  const t = tileAt(P.x,P.y);
  if (P.z<=0){
    if (t===1){ if (P.inv>0){ P.x = P.safe.x; P.y = P.safe.y; } else { hitLava(); return; } }
    else if (t===4){ P.x = P.safe.x; P.y = P.safe.y; if ((S.t-(S.seaT||0))>2){ S.seaT = S.t; toast(S.bb ? 'Isso é suco de blueberry! Não dá para nadar. Voe de Lambery.' : 'Não dá para nadar! Use a ponte ou voe de Lambery.'); } }
    else P.safe = {x:P.x, y:P.y};
  }
  if (t===2){
    arenaT += dt;
    const sec = Math.floor(arenaT);
    if (sec>lastTick){ lastTick = sec; if (sec<ARENA_TIME) SFX.tick(); }
    if (arenaT>=ARENA_TIME){
      const B = enemies.find(e => e.boss && !e.dead && e.state!=='rise' && e.state!=='dying');
      const n = nearestLava(P.x,P.y).p || (B ? {x:B.x, y:B.y} : {x:CX, y:CY});
      if (B){ startGrab(B.x, B.y, 'reach'); grab.oz = BOSS_MOUTH; } else startGrab(CX, CY, 'reach');
      grab.lx = n.x; grab.ly = n.y;
      toast('Tempo esgotado! A língua te pegou.'); return;
    }
  } else { arenaT = 0; lastTick = 0; }

  updateLamberys(dt);
  updateEnemies(dt);
  if (S.mode!=='play') return;

  // chaves no chão
  for (const k of fieldKeys){
    if (Math.hypot(P.x-k.x, P.y-k.y) < .6 && P.z < .9){
      k.got = true; P.keys++; SFX.key(); burst(k.x, k.y, 18, '#ffc93c', 14, 100);
      toast('Você pegou uma chave!'); updHUD();
    }
  }
  fieldKeys = fieldKeys.filter(k => !k.got);

  // itens saindo dos baús
  for (const it of items){ it.t += dt; if (it.t>=.9 && !it.done){ it.done = true; applyItem(it.kind); if (S.mode!=='play') return; } }
  items = items.filter(i => !i.done);
  if (S.L.world){ updateWorld(dt); if (S.mode!=='play') return; }
  if (!S.L.boss && !S.L.world && chests.length && chests.every(c => c.open) && !items.length){ toast('Todos os baús abertos!'); levelClear(); return; }


  // nunca travar sem chave
  if (!S.L.world && P.keys===0 && fieldKeys.length===0 && !items.some(i=>i.kind==='key') && chests.some(c=>!c.open)){
    softT += dt;
    if (softT>2.5){ spawnFieldKey(Math.random()<.5); softT = 0; toast('Uma chave nova apareceu no chão!'); }
  } else softT = 0;
}

// ---------- desenho ----------
let DPR = 1, VW = 0, VH = 0, cam = {x:0, y:0, s:1, follow:false, init:false};
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1); VW = innerWidth; VH = innerHeight;
  cv.width = Math.round(VW*DPR); cv.height = Math.round(VH*DPR);
  cv.style.width = VW+'px'; cv.style.height = VH+'px';
}
addEventListener('resize', resize); resize();

function updCam(dt){
  const MAP_W = (W+H)*TW/2, MAP_H = (W+H)*TH/2 + 60;
  const fit = Math.min((VW-32)/MAP_W, (VH-150)/MAP_H);
  const s = (S.L.boss || S.L.world) ? Math.min(.62, fit*.999) : Math.min(1.3, fit);
  const mx = (W-H)*TW/4, my = (W+H)*TH/4 + 10;
  if (s < .62){
    cam.s = S.L.boss ? clamp(Math.min(VW,VH)/1150, .45, .8) : S.L.world ? clamp(Math.min(VW,VH)/900, .6, .95) : .62; cam.follow = true;
    const [px,py] = iso(P.x,P.y); let tx = px, ty = py - 20;
    const B = S.L.boss && enemies.find(e => e.boss && !e.dead);
    if (B){ const [bx,by] = iso(B.x,B.y), hy = by - BOSS_MOUTH*ZPX - 60; const w = Math.hypot(B.x-P.x, B.y-P.y) < 14 ? .45 : .15; tx += (bx-tx)*w; ty += (hy-ty)*w; }
    const k = cam.init ? Math.min(1, dt*5) : 1;
    cam.x += (tx-cam.x)*k; cam.y += (ty-cam.y)*k;
  } else { cam.s = s; cam.follow = false; cam.x = mx; cam.y = my - 30/s; }
  cam.init = true;
}

function poly(pts){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.closePath(); }
function diamond(x,y,dy=0){ const a=iso(x,y),b=iso(x+1,y),c=iso(x+1,y+1),d=iso(x,y+1); poly([[a[0],a[1]+dy],[b[0],b[1]+dy],[c[0],c[1]+dy],[d[0],d[1]+dy]]); }
function gline(pts){ ctx.beginPath(); pts.forEach(([x,y],i) => { const [a,b] = iso(x,y); i ? ctx.lineTo(a,b) : ctx.moveTo(a,b); }); ctx.stroke(); }

function drawBackground(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g = ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,S.L.bg[0]); g.addColorStop(1,S.L.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0,0,VW,VH);
  for (const [fx,fy] of [[.08,0],[.92,0]]){
    const r = ctx.createRadialGradient(VW*fx,VH*fy,0,VW*fx,VH*fy,Math.max(VW,VH)*.6);
    r.addColorStop(0,`rgba(${S.L.light},.13)`); r.addColorStop(1,`rgba(${S.L.light},0)`);
    ctx.fillStyle = r; ctx.fillRect(0,0,VW,VH);
  }
}

const BB_CHAO = ['#5a73d8','#566fd2','#5f78de','#5269cc','#5c75da','#5871d4','#627be0','#546bce'], BB_AREIA = ['#c9b8e8','#c3b2e2','#cfbeee','#bfaedd','#cbbaea','#c6b5e5','#d2c1f0','#c1b0df'];
function drawField(){
  const T = S.t, L = S.L, hz = L.haz;
  // laterais do bloco
  const sd = 26;
  let a = iso(0,H), b = iso(W,H);
  poly([a,b,[b[0],b[1]+sd],[a[0],a[1]+sd]]); ctx.fillStyle = S.L.side[0]; ctx.fill();
  a = iso(W,0);
  poly([a,b,[b[0],b[1]+sd],[a[0],a[1]+sd]]); ctx.fillStyle = S.L.side[1]; ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  poly([iso(0,H),iso(W,H),[iso(W,H)[0],iso(W,H)[1]+6],[iso(0,H)[0],iso(0,H)[1]+6]]); ctx.fill();

  // pisos
  const danger = arenaT/ARENA_TIME;
  const vx0 = cam.x - VW/2/cam.s - 80, vx1 = cam.x + VW/2/cam.s + 80, vy0 = cam.y - (VH/2+30)/cam.s - 80, vy1 = cam.y + (VH/2)/cam.s + 80;
  const isWater = (x, y) => x<0 || y<0 || x>=W || y>=H || tiles[y][x]===4;
  const tb = tileBounds(2);
  for (let y=tb.y0;y<=tb.y1;y++) for (let x=tb.x0;x<=tb.x1;x++){
    const t = tiles[y][x];
    const cxs = (x-y)*TW/2, cys = (x+y+1)*TH/2;
    if (cxs < vx0 || cxs > vx1 || cys < vy0 || cys > vy1) continue;
    if (t===0){
      const n = ((x*73856093) ^ (y*19349663)) & 7;
      let fl = L.floor, seam = L.seam, dec = L.decor;
      if (L.world){
        const rg = region[y][x];
        if (isWater(x-1,y) || isWater(x+1,y) || isWater(x,y-1) || isWater(x,y+1)){ fl = S.bb ? BB_AREIA : L.sand; seam = 'rgba(80,60,20,.3)'; dec = ''; }
        else if (S.bb){ fl = BB_CHAO; seam = 'rgba(20,20,60,.35)'; dec = ''; }
        else if (rg===1){ fl = L.floorB; seam = L.seamB; dec = L.decorB; }
        if (penTile && penTile[y][x]){ fl = ['#7a5a3a','#76563a','#80603f','#715236','#7c5c3c','#785838','#836341','#735437']; seam = 'rgba(40,25,10,.4)'; dec = ''; }
      }
      ctx.fillStyle = fl[n];
      diamond(x,y); ctx.fill();
      ctx.strokeStyle = seam; ctx.lineWidth = 1.5; ctx.stroke();
      drawDecor(dec, n, x, y, T);
    } else if (t===4){
      const v = .5 + .5*Math.sin(T*1.6 + x*.7 + y*.9);
      ctx.fillStyle = S.bb ? `hsl(${268+v*12},55%,${26+v*9}%)` : `hsl(${205+v*10},70%,${24+v*8}%)`; diamond(x,y,4); ctx.fill();
      if (((x*7+y*13)&7)===0){ const [mx,my] = iso(x+.5,y+.5); ctx.strokeStyle = `rgba(200,235,255,${.25+.3*v})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(mx-8,my+4); ctx.quadraticCurveTo(mx-3,my+1+Math.sin(T*3+x)*1.5,mx+2,my+4); ctx.stroke(); }
      ctx.fillStyle = S.bb ? '#1e0b3a' : '#0b2140';
      if (y>0 && tiles[y-1][x]!==4){ const p=iso(x,y), q=iso(x+1,y); poly([p,q,[q[0],q[1]+7],[p[0],p[1]+7]]); ctx.fill(); }
      if (x>0 && tiles[y][x-1]!==4){ const p=iso(x,y), q=iso(x,y+1); poly([p,q,[q[0],q[1]+7],[p[0],p[1]+7]]); ctx.fill(); }
    } else if (t===5){
      ctx.fillStyle = (x%2) ? '#8a5a2b' : '#7d5025'; diamond(x,y); ctx.fill();
      ctx.strokeStyle = '#4a2e14'; ctx.lineWidth = 1; ctx.stroke();
      const a = iso(x+.5,y), b = iso(x+.5,y+1); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    } else if (t===2){
      ctx.fillStyle = (x+y)%2 ? '#5d2d8c' : '#6a36a0';
      diamond(x,y); ctx.fill();
      const glow = .12 + .08*Math.sin(T*3 + (x+y)*.6);
      ctx.fillStyle = `rgba(190,140,255,${glow})`; ctx.fill();
      if (danger>0){ ctx.fillStyle = `rgba(255,50,60,${danger*.45*(.7+.3*Math.sin(T*18))})`; ctx.fill(); }
    } else {
      const v = .5 + .5*Math.sin(T*2.2 + x*.9 + y*1.3) * Math.cos(T*1.3 + x*.4 - y*.7);
      ctx.fillStyle = `hsl(${hz.h[0]+v*(hz.h[1]-hz.h[0])},${hz.s}%,${hz.l[0]+v*(hz.l[1]-hz.l[0])}%)`;
      diamond(x,y,3); ctx.fill();
      // bordas afundadas onde encosta na grama
      ctx.fillStyle = hz.rim;
      if (y===0 || tiles[y-1][x]!==1){ const p=iso(x,y), q=iso(x+1,y); poly([p,q,[q[0],q[1]+6],[p[0],p[1]+6]]); ctx.fill(); }
      if (x===0 || tiles[y][x-1]!==1){ const p=iso(x,y), q=iso(x,y+1); poly([p,q,[q[0],q[1]+6],[p[0],p[1]+6]]); ctx.fill(); }
      if (t===3){
        const f = frozenT.get(x+','+y), blink = f && f.t<1.5 && Math.floor(T*8)%2;
        ctx.fillStyle = blink ? 'rgba(200,240,255,.45)' : 'rgba(210,242,255,.88)';
        diamond(x,y,1); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.2; ctx.stroke();
        const [mx,my] = iso(x+.5,y+.5); ctx.beginPath(); ctx.moveTo(mx-8,my+2); ctx.lineTo(mx+1,my-3); ctx.stroke();
      }
    }
  }

  // círculo de runas da arena (o Planeta Poção não tem arena)
  ctx.lineJoin = 'round';
  if (!L.world){
    const circ = []; for (let k=0;k<=56;k++){ const a = k/56*Math.PI*2; circ.push([CX+Math.cos(a)*ARENA_R, CY+Math.sin(a)*ARENA_R]); }
    ctx.strokeStyle = `rgba(215,180,255,${.6+.3*Math.sin(T*3)})`; ctx.lineWidth = 2.5; gline(circ);
    ctx.fillStyle = 'rgba(230,205,255,.8)';
    for (let k=0;k<8;k++){ const a = k/8*Math.PI*2 + T*.3; const [rx,ry] = iso(CX+Math.cos(a)*(ARENA_R-.35), CY+Math.sin(a)*(ARENA_R-.35));
      ctx.beginPath(); ctx.moveTo(rx,ry-4); ctx.lineTo(rx+3,ry); ctx.lineTo(rx,ry+4); ctx.lineTo(rx-3,ry); ctx.closePath(); ctx.fill(); }
  }

  // brilho da lava
  ctx.globalCompositeOperation = 'lighter';
  for (const [x,y] of lavaTiles){
    if ((x+y)%2) continue;
    const [sx,sy] = iso(x+.5,y+.5);
    const r = ctx.createRadialGradient(sx,sy,0,sx,sy,70);
    r.addColorStop(0,`rgba(${hz.glow},.16)`); r.addColorStop(1,`rgba(${hz.glow},0)`);
    ctx.fillStyle = r; ctx.fillRect(sx-70,sy-70,140,140);
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawFormCostume(l, f){
  const v = l.variant;
  if (v==='gloower'){
    ctx.fillStyle = '#ffd23f'; for (const [x,y] of [[-5,-10],[3,-12],[7,-7],[-1,-6]]){ ctx.beginPath(); ctx.arc(x,y,1.1,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle = '#2f5fd0'; ctx.strokeStyle = '#162d6e'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(f*13,-27.5,9,2.6,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(f*7.5,-28); ctx.lineTo(f*18.5,-28); ctx.lineTo(f*9.5,-44); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(f*9.5,-44,2,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#12161f'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(f*11,-23,4,0,Math.PI*2); ctx.moveTo(f*15.5+3.8,-23); ctx.arc(f*15.5,-23,3.8,0,Math.PI*2); ctx.stroke();
  } else if (v==='caio'){
    ctx.fillStyle = '#cfd6e2'; ctx.strokeStyle = '#4b5566'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(f*13,-23,8,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(f*13,-31); ctx.quadraticCurveTo(f*7,-38,f*2,-31); ctx.stroke();
    ctx.fillStyle = '#c0392b'; ctx.strokeStyle = '#6e1a12'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-f*7,-15); ctx.lineTo(-f*1,-15); ctx.lineTo(-f*1,-9); ctx.quadraticCurveTo(-f*4,-4,-f*7,-9); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (v==='barry'){
    ctx.fillStyle = '#2d2388'; ctx.fillRect(f*13-12,-40,4,18); ctx.fillRect(f*13+8,-40,4,18);
    ctx.fillStyle = '#15151f'; ctx.fillRect(f*13-6,-31,12,4); ctx.fillRect(f*13-4,-34,8,3); ctx.fillStyle = '#f4f4f4'; ctx.fillRect(f*13-.8,-33,1.6,1.6);
  } else {
    ctx.fillStyle = CUSTOM.detalhe; ctx.strokeStyle = shadeHex(CUSTOM.detalhe,-.4); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(f*8,-27); ctx.lineTo(f*8,-32); ctx.lineTo(f*10.5,-29.5); ctx.lineTo(f*13,-34); ctx.lineTo(f*15.5,-29.5); ctx.lineTo(f*18,-32); ctx.lineTo(f*18,-27); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function drawLambery(l, sx, sy){
  const C = Object.assign({body:'#d8413a', dark:'#7a1a16', belly:'#ffc9b0', tail:'#b8322c', legs:'#9e2a24'}, l.pal||{});
  const f = l.face, w = l.wings, flap = Math.sin(S.t*16)*.35*w;
  ctx.save(); ctx.translate(sx, sy);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // asas que saem das costas
  if (w>.03){
    for (const side of [-1,1]){
      const tipX = side*(6+24*w), tipY = -30 - 12*w - flap*20*side;
      ctx.fillStyle = 'rgba(168,228,255,.88)'; ctx.strokeStyle = '#4f9fcf'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(side*3,-17);
      ctx.quadraticCurveTo(side*(4+10*w), tipY-4, tipX, tipY);
      ctx.quadraticCurveTo(side*(4+20*w), -18-4*w, side*(4+17*w), -13);
      ctx.quadraticCurveTo(side*(4+11*w), -16, side*(3+8*w), -12);
      ctx.quadraticCurveTo(side*5, -14, side*3, -12);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(side*3,-16); ctx.lineTo(side*(4+17*w),-13); ctx.moveTo(side*3,-16); ctx.lineTo(side*(3+8*w),-12); ctx.stroke();
    }
  }
  // rabo
  ctx.strokeStyle = C.tail; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-f*9,-8); ctx.quadraticCurveTo(-f*18,-6,-f*21,-12); ctx.stroke();
  ctx.fillStyle = '#f2e6b3'; ctx.beginPath(); ctx.moveTo(-f*20,-15); ctx.lineTo(-f*25,-14); ctx.lineTo(-f*21,-9); ctx.closePath(); ctx.fill();
  // patas
  const st = l.state==='ridden' ? Math.sin(P.walk*3)*1.5 : Math.sin(l.ph*5)*1;
  ctx.fillStyle = C.legs;
  for (const [x,o] of [[-7,1],[-2,-1],[4,1],[9,-1]]){ ctx.beginPath(); ctx.ellipse(x,-2+st*o*.5,2.8,2,0,0,Math.PI*2); ctx.fill(); }
  // corpo
  ctx.fillStyle = C.body; ctx.strokeStyle = C.dark; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0,-9,13,8,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.belly; ctx.beginPath(); ctx.ellipse(f*2,-6,8,3.6,0,0,Math.PI*2); ctx.fill();
  // sela de pedra
  ctx.fillStyle = '#8d8a86'; ctx.strokeStyle = '#55524e'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-8,-15); ctx.lineTo(8,-15); ctx.lineTo(7,-20); ctx.quadraticCurveTo(0,-18,-7,-20); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#6f6c68'; ctx.fillRect(-9,-16,3,4); ctx.fillRect(6,-16,3,4);
  ctx.fillStyle = '#a9a6a1'; [[-4,-18],[2,-17],[5,-19]].forEach(([x,y]) => ctx.fillRect(x,y,1.6,1.6));
  // pescoço e cabeça
  ctx.fillStyle = C.body; ctx.strokeStyle = C.dark; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(f*10,-15,4,6,f*.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(f*13,-21,7,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(f*18,-18.5,5,3.6,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f2e6b3';
  for (const hx of [9,14]){ ctx.beginPath(); ctx.moveTo(f*(hx-1.5),-26); ctx.lineTo(f*(hx+.5),-32); ctx.lineTo(f*(hx+2),-26.5); ctx.closePath(); ctx.fill(); }
  // olhos ovais enormes
  if (l.eyes==='palito'){
    ctx.strokeStyle = '#12161f'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(f*11,-25.5); ctx.lineTo(f*11,-21); ctx.moveTo(f*15.5,-25.5); ctx.lineTo(f*15.5,-21); ctx.stroke();
  } else if (l.eyes==='um'){
    ctx.fillStyle = '#ffffff'; ctx.fillRect(f*13.3-4.5,-27,9,8); ctx.fillStyle = '#12161f'; ctx.fillRect(f*14.3-1.5,-25,3,4.5);
  } else for (const [ex,rx,ry] of [[11,3.4,5.2],[15.5,3.1,4.8]]){
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = C.dark; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(f*ex,-23,rx,ry,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#12161f'; ctx.beginPath(); ctx.ellipse(f*(ex+.8),-22.5,1.6,2.9,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(f*(ex+.3),-24,.8,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = C.dark; ctx.beginPath(); ctx.arc(f*21,-19.5,.9,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = C.dark; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(f*15,-16.5); ctx.quadraticCurveTo(f*18,-15,f*21,-17); ctx.stroke();
  if (l.form) drawFormCostume(l, f);
  ctx.restore();
}

function drawDecor(dec, n, x, y, T){
  if (n!==3 && n!==6) return;
  const [mx,my] = iso(x+.5, y+.5);
  if (dec==='estrelas'){

function drawChest(c){
  const [sx,sy] = iso(c.x,c.y);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(sx,sy+2,24,11,0,0,Math.PI*2); ctx.fill();
  const hw = .36, hd = .26, h = 16;
  const p = (dx,dy,dz) => { const [a,b] = iso(c.x+dx,c.y+dy); return [a,b-dz]; };
  const A=p(-hw,hd,0), B=p(hw,hd,0), C=p(hw,-hd,0), A2=p(-hw,hd,h), B2=p(hw,hd,h), C2=p(hw,-hd,h), D2=p(-hw,-hd,h);
  poly([A,B,B2,A2]); ctx.fillStyle = '#8a4b22'; ctx.fill();
  poly([B,C,C2,B2]); ctx.fillStyle = '#6a3618'; ctx.fill();
  ctx.strokeStyle = '#e0a93a'; ctx.lineWidth = 2.5;
  const m1 = p(0,hd,0), m2 = p(0,hd,h), n1 = p(hw,0,0), n2 = p(hw,0,h);
  ctx.beginPath(); ctx.moveTo(m1[0],m1[1]); ctx.lineTo(m2[0],m2[1]); ctx.moveTo(n1[0],n1[1]); ctx.lineTo(n2[0],n2[1]); ctx.stroke();
  if (!c.open){
    poly([A2,B2,C2,D2]); ctx.fillStyle = '#a95d2a'; ctx.fill();
    ctx.strokeStyle = '#e0a93a'; ctx.lineWidth = 2; ctx.stroke();
    const L = p(0,hd,h*.55); ctx.fillStyle = '#ffd23f'; ctx.fillRect(L[0]-3.5,L[1]-4,7,8);
    ctx.fillStyle = '#3a1d0b'; ctx.fillRect(L[0]-1,L[1]-1,2,3);
    if (P.keys>0){
      const a = .35 + .35*Math.sin(S.t*5 + c.x);
      ctx.strokeStyle = `rgba(255,210,63,${a})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(sx,sy+2,30,14,0,0,Math.PI*2); ctx.stroke();
    }
  } else {
    poly([A2,B2,C2,D2]); ctx.fillStyle = '#2a1408'; ctx.fill();
    const lift = Math.min(1, c.openT*5)*16;
    const D3 = [D2[0]+2, D2[1]-lift], C3 = [C2[0]+2, C2[1]-lift];
    poly([D2,C2,C3,D3]); ctx.fillStyle = '#a95d2a'; ctx.fill(); ctx.strokeStyle = '#e0a93a'; ctx.lineWidth = 2; ctx.stroke();
    if (c.openT < 2){

}

function drawItem(it){
  if (it.t<0) return;
  const k = it.t;
  let x, y, z;
  if (k<.35){ const e = k/.35; x = it.x; y = it.y; z = 18 + e*40; }
  else { const e = Math.min(1,(k-.35)/.55); x = it.x + (P.x-it.x)*e; y = it.y + (P.y-it.y)*e; z = 58 - e*30 + P.z*ZPX*e; }

  else if (it.kind==='veneno') drawPoisonTube(ctx, sx, sy-z, 1.1, -.35);

function drawSilhouette(cvs, locked){
  const g = cvs.getContext('2d'), w = cvs.width, h = cvs.height;
  const bg = g.createRadialGradient(w/2,h*.55,10,w/2,h*.55,w*.7);
  bg.addColorStop(0, locked ? '#232338' : '#4a1d63'); bg.addColorStop(1, locked ? '#11121d' : '#140b22');
  g.fillStyle = bg; g.fillRect(0,0,w,h);
  const off = document.createElement('canvas'); off.width = w; off.height = h;
  const o = off.getContext('2d'), sc = h/78;
  o.setTransform(sc,0,0,sc,w/2,h*.8);
  drawCharacter(o, 'gloower', 1, 0, true);
  o.setTransform(1,0,0,1,0,0); o.globalCompositeOperation = 'source-in';
  o.fillStyle = locked ? '#07070d' : '#0e0619'; o.fillRect(0,0,w,h);
  g.save(); g.shadowColor = locked ? 'rgba(255,255,255,.18)' : 'rgba(255,106,230,.95)'; g.shadowBlur = locked ? 18 : 40;
  g.drawImage(off,0,0); g.drawImage(off,0,0); g.restore();
  if (locked){ g.fillStyle = 'rgba(255,255,255,.55)'; g.font = `400 ${h*.16}px "Bagel Fat One", Impact, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', w/2, h*.5); }
}

function drawPlayer(){
  if (S.semJogador) return;
  const [sx,sy] = iso(P.x,P.y), zz = P.z*ZPX;
  if (!P.dead){
    ctx.fillStyle = `rgba(0,0,0,${.35 - Math.min(.2,P.z*.1)})`;
    ctx.beginPath(); ctx.ellipse(sx,sy,13*(1-Math.min(.4,P.z*.2)),6*(1-Math.min(.4,P.z*.2)),0,0,Math.PI*2); ctx.fill();
  }
  ctx.save();
  let alpha = 1;
  if (P.dead) alpha = Math.max(0, P.deadT);
  else if (P.inv>0 && Math.floor(S.t*14)%2) alpha = .45;
  ctx.globalAlpha = alpha;
  ctx.translate(sx, sy - zz);
  if (P.vira>0){ ctx.translate(0, -24); ctx.scale(1, Math.cos((1-P.vira)*Math.PI*2)); ctx.translate(0, 24); } // virando igual figurinha
  const formOn = P.mount && P.mount.form;
  if (P.mount){ if (P.ultraGlow>0 && !P.dead){ const gc = S.glacial>0 ? '150,225,255' : '255,236,80'; const gl = ctx.createRadialGradient(0,-14,4,0,-14,40); gl.addColorStop(0,`rgba(${gc},.5)`); gl.addColorStop(1,`rgba(${gc},0)`); ctx.fillStyle = gl; ctx.fillRect(-44,-56,88,72); } drawLambery(P.mount, 0, 0); ctx.translate(0, -15); }
  const moving = Math.hypot(P.vx,P.vy) > .1 && P.z<=0;
  const st = moving ? Math.sin(P.walk*3)*3 : 0;
  const weapon = powerOf()==='gloower' ? !zip : powerOf()==='caio' ? !boom : !tri;
  if (!formOn && P.ultraGlow>0 && !P.dead){
    const a = Math.min(1, P.ultraGlow)*(.75+.25*Math.sin(S.t*10));
    const gc = S.glacial>0 ? '150,225,255' : '255,236,80';
    const gl = ctx.createRadialGradient(0,-28,4,0,-28,46); gl.addColorStop(0,`rgba(${gc},${.6*a})`); gl.addColorStop(1,`rgba(${gc},0)`);
    ctx.fillStyle = gl; ctx.fillRect(-44,-72,88,88);
    ctx.save(); ctx.shadowColor = S.glacial>0 ? `rgba(160,230,255,${a})` : `rgba(255,230,40,${a})`; ctx.shadowBlur = 16;
    drawCharacter(ctx, S.skin, P.face, st, weapon); ctx.restore();
  }
  if (!formOn){ drawCharacter(ctx, S.skin, P.face, st, weapon); if (P.ultraGlow>0 && !P.dead) drawNeonEyes(ctx, S.skin, P.face); }
  ctx.restore();
  if (P.star>0 && !P.dead){
    const a = Math.min(1, P.star);
    ctx.save(); ctx.globalAlpha = .9*a;
    const gl = ctx.createRadialGradient(sx,sy-zz-26,4,sx,sy-zz-26,40); gl.addColorStop(0,'rgba(80,150,255,.45)'); gl.addColorStop(1,'rgba(80,150,255,0)');
    ctx.fillStyle = gl; ctx.fillRect(sx-40,sy-zz-66,80,80);
    for (let i=0;i<5;i++){
      const an = S.t*5 + i*Math.PI*2/5, x = sx + Math.cos(an)*22, y = sy-zz-26 + Math.sin(an)*10;
      ctx.fillStyle = i%2 ? '#ffe066' : '#bfe0ff'; ctx.beginPath();
      for (let j=0;j<10;j++){ const r = j%2 ? 1.6 : 4, b = j*Math.PI/5 - Math.PI/2; ctx.lineTo(x+Math.cos(b)*r, y+Math.sin(b)*r); } ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  if (eff.shield && !P.dead){
    ctx.strokeStyle = `rgba(192,123,255,${.55+.25*Math.sin(S.t*6)})`; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(sx, sy-zz-26, 26, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(192,123,255,.1)'; ctx.fill();
  }
  if (eff.speed>0 && moving){ burst(P.x, P.y, 4, 'rgba(63,169,255,.7)', 1, 20, 0, 2); }
}

function drawSword(x, y, h, ang){
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.lineCap = 'round';
  ctx.strokeStyle = '#1b1c2a'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-h); ctx.stroke();
  ctx.strokeStyle = '#e4e9f2'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-h); ctx.stroke();
  ctx.strokeStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(-5,-h+4); ctx.lineTo(5,-h+4); ctx.stroke();
  ctx.strokeStyle = '#7a4b25'; ctx.beginPath(); ctx.moveTo(0,-h+4); ctx.lineTo(0,-h-3); ctx.stroke();
  ctx.restore();
}
function drawAbilities(){
  if (zip){
    const [px,py] = iso(P.x,P.y), hand = [px + P.face*9, py - P.z*ZPX - 20];
    if (zip.phase==='throw'){
      const [sx,sy] = iso(zip.hx,zip.hy);
      ctx.strokeStyle = '#d9c38c'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(hand[0],hand[1]); ctx.lineTo(sx,sy-20); ctx.stroke();
      drawSword(sx, sy-12, 22, S.t*25);
    } else {
      const [sx,sy] = iso(zip.tx,zip.ty);
      ctx.strokeStyle = '#d9c38c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(hand[0],hand[1]); ctx.lineTo(sx,sy-24); ctx.stroke();
      drawSword(sx, sy+2, 22, .15);
    }
  }
  if (boom){
    const [sx,sy] = iso(boom.x,boom.y);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(sx,sy,9,4,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(228,233,242,.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sx,sy-24,14,0,Math.PI*2); ctx.stroke();
    drawSword(sx, sy-24 + 12, 24, boom.spin);
  }
  if (tri){
    const [sx,sy] = iso(tri.x,tri.y);
    const ang = Math.atan2((tri.dx+tri.dy)*TH/2, (tri.dx-tri.dy)*TW/2);
    const hgt = tri.stuck>0 ? 8 : 20;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(sx,sy,10,4,0,0,Math.PI*2); ctx.fill();
    ctx.save(); ctx.translate(sx, sy-hgt); ctx.rotate(ang);
    ctx.fillStyle = '#c99a2e'; ctx.fillRect(-30,-1.5,30,3);
    ctx.fillStyle = '#ffc93c'; ctx.fillRect(-2,-7,3,14); ctx.fillRect(0,-7,9,3); ctx.fillRect(0,-1.5,12,3); ctx.fillRect(0,4,9,3);
    ctx.restore();
  }
}

function drawCountdown(){
  if (arenaT<=0 || grab || P.dead) return;
  const [sx,sy] = iso(P.x,P.y), y = sy - P.z*ZPX - 84, left = ARENA_TIME - arenaT;
  ctx.fillStyle = 'rgba(20,10,30,.8)'; ctx.beginPath(); ctx.arc(sx,y,19,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = left < 1 ? '#ff4d4d' : '#ffc93c'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(sx,y,19,-Math.PI/2, -Math.PI/2 + Math.PI*2*(left/ARENA_TIME)); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '400 22px "Bagel Fat One", Impact, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(Math.ceil(left), sx, y+1);
  ctx.font = '700 12px Signika, sans-serif'; ctx.fillStyle = '#ffe3a0'; ctx.fillText('PULE!', sx, y+32);
}

function tonguePath(ax, ay, cx, cy, bx, by){ ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(cx,cy,bx,by); }
function drawTongue(ox, oy, hx, hy, hz, closed, oz=0){
  const [ax,ay0] = iso(ox,oy), ay = ay0 - 4 - oz*ZPX;
  let [bx,by] = iso(hx,hy); by -= hz*ZPX + 16;
  const dist = Math.hypot(bx-ax, by-ay);
  const cx = (ax+bx)/2 + Math.sin(S.t*9)*8, cy = (ay+by)/2 - 30 - dist*.18;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // espiral enrolada na base
  const spiral = [];
  for (let a=0; a<=4*Math.PI; a+=.25){ const r = 3 + a*2.1; spiral.push([ax + Math.cos(a+S.t*3)*r, ay - 8 + Math.sin(a+S.t*3)*r*.55]); }
  const strokeAll = (fn, w) => {
    ctx.strokeStyle = '#4a0d24'; ctx.lineWidth = w+5; fn(); ctx.stroke();
    ctx.strokeStyle = '#ff5d8f'; ctx.lineWidth = w; fn(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,190,210,.8)'; ctx.lineWidth = Math.max(1.5, w*.22); fn(); ctx.stroke();
  };
  strokeAll(() => { ctx.beginPath(); spiral.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); }, 7);
  strokeAll(() => tonguePath(ax, ay, cx, cy, bx, by), 11);
  // mão na ponta
  const ang = Math.atan2(by-cy, bx-cx), fl = closed ? 6 : 13;
  const fingers = [-.65,-.22,.22,.65].map(o => ang + o).concat([ang + 1.45]);
  for (const pass of [['#4a0d24',9],['#ff5d8f',5.5]]){
    ctx.strokeStyle = pass[0]; ctx.lineWidth = pass[1];
    fingers.forEach((a,i) => {
      const len = i===4 ? fl*.75 : fl;
      const bend = closed ? 1.1 : .25;
      const mx = bx + Math.cos(a)*9 + Math.cos(a)*len*.55, my = by + Math.sin(a)*7 + Math.sin(a)*len*.55;
      const ex = mx + Math.cos(a+bend*(i<2?1:-1))*len*.5, ey = my + Math.sin(a+bend*(i<2?1:-1))*len*.5;
      ctx.beginPath(); ctx.moveTo(bx + Math.cos(a)*6, by + Math.sin(a)*5); ctx.lineTo(mx,my); ctx.lineTo(ex,ey); ctx.stroke();
    });
  }
  ctx.fillStyle = '#ff5d8f'; ctx.strokeStyle = '#4a0d24'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(bx,by,11,9,ang,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,190,210,.7)'; ctx.beginPath(); ctx.ellipse(bx-2,by-2,4,3,ang,0,Math.PI*2); ctx.fill();
  if (Math.random()<.4) burst(ox, oy, 4, '#c07bff', 1, 90, 200, 3);
}

function drawLashWarn(l){
  const [sx,sy] = iso(l.tx,l.ty), k = Math.min(1, l.t/.85);
  const RX = TW/Math.SQRT2*.7, RY = TH/Math.SQRT2*.7;
  ctx.strokeStyle = `rgba(255,70,50,${.5+.4*Math.sin(S.t*20)})`; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(sx,sy,RX,RY,0,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,70,50,.25)'; ctx.beginPath(); ctx.ellipse(sx,sy,RX*k,RY*k,0,0,Math.PI*2); ctx.fill();
  const [ox,oy] = iso(l.ox,l.oy);
  ctx.fillStyle = '#fff4d6'; ctx.font = '400 20px "Bagel Fat One", Impact, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('!', ox, oy - 18 - Math.abs(Math.sin(S.t*12))*6);
  if (Math.random()<.5) burst(l.ox, l.oy, 2, '#ffb020', 1, 70, 160, 3);
}

function render(dt){
  drawBackground();
  updCam(dt);
  const s = cam.s;
  let shx = 0, shy = 0;
  if (S.shake && S.shake.t>0){ const a = S.shake.amp*(S.shake.t/S.shake.max); shx = rnd(-a,a); shy = rnd(-a,a); S.shake.t -= dt; }
  ctx.setTransform(DPR*s,0,0,DPR*s, DPR*(VW/2 - cam.x*s + shx), DPR*(VH/2 + 30 - cam.y*s + shy));
  drawField();
  for (const l of lashes) if (l.phase==='warn') drawLashWarn(l);
  if (S.L.world) drawCityGrounds();
  const ents = [];
  for (const c of chests) ents.push([c.x+c.y, () => drawChest(c)]);
  for (const k of fieldKeys) ents.push([k.x+k.y, () => drawFieldKey(k)]);
  for (const e of enemies) if (!e.dead && emVista(e.x,e.y)) ents.push([e.x+e.y, () => e.boss ? drawZambery(e) : drawEnemy(e)]);
  if (robot && S.mode!=='menu') ents.push([robot.x+robot.y, () => drawRobot(robot)]);
  if (S.L.world && S.mode!=='menu'){
    for (const rb of robots) ents.push([rb.x+rb.y, () => drawRobot(rb)]);
    for (const p of SV.pens){ for (const [a,b,c,d] of penFenceSegs(p)) ents.push([(a+c)/2+(b+d)/2 + (b===d && b===p.y0 ? -.05 : 0) + (a===c && a===p.x0 ? -.05 : 0), () => drawFence(a,b,c,d)]); ents.push([p.x0+3.5+p.y0+p.h+.2, () => drawPenLabel(p)]); }
  }
  if (S.L.world){
    const vis = (x, y) => { const ix = (x-y)*TW/2, iy = (x+y)*TH/2; return Math.abs(ix-cam.x) < VW/2/cam.s + 140 && iy > cam.y - (VH/2+30)/cam.s - 180 && iy < cam.y + VH/2/cam.s + 140; };
    for (const n of nodes) if (vis(n.x,n.y) && explorado(n.x,n.y)) ents.push([n.x+n.y, () => drawNode(n)]);
    for (const b of SV.builds) if (vis(b.x,b.y) && explorado(b.x,b.y)) ents.push([b.x+b.y, () => drawBuild(b)]);
    for (const L of (S.landmarks||[])) if (vis(L.x,L.y)){ const dl = WX.landmarks[L.key]; if (dl && dl.cidade){ for (const pt of dl.partes) if (explorado(L.x+pt.dx, L.y+pt.dy)) ents.push([L.x+pt.dx+L.y+pt.dy, () => drawCityPart(L, pt)]); } else if (explorado(L.x, L.y)) ents.push([L.x+L.y, () => drawLandmark(L)]); }
    for (const g of piggys) if (vis(g.x,g.y) && emVista(g.x,g.y)) ents.push([g.x+g.y, () => drawPiggy(g)]);
    for (const c of chicks) if (vis(c.x,c.y) && emVista(c.x,c.y)) ents.push([c.x+c.y, () => drawChick(c)]);
    for (const e of eggs) if (vis(e.x,e.y) && emVista(e.x,e.y)) ents.push([e.x+e.y, () => drawEgg(e)]);
    for (const d of drops) if (vis(d.x,d.y) && emVista(d.x,d.y)) ents.push([d.x+d.y, () => drawDrop(d)]);
  }
  for (const l of lamberys) if (P.mount!==l && emVista(l.x,l.y)) ents.push([l.x+l.y, () => { const [lx,ly] = iso(l.x,l.y); ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(lx,ly,15,6,0,0,Math.PI*2); ctx.fill(); drawLambery(l, lx, ly); }]);
  if (S.mode!=='menu' && (P.lives>0 || P.dead)) ents.push([P.x+P.y + .01, drawPlayer]);
  ents.sort((a,b) => a[0]-b[0]).forEach(e => e[1]());
  drawEfire();
  if (S.L.world) drawCityFire();
  for (const l of lashes) if (l.phase!=='warn') drawTongue(l.ox, l.oy, l.hx, l.hy, 0, false);
  if (grab) drawTongue(grab.ox, grab.oy, grab.hx, grab.hy, grab.phase==='drag' ? P.z : 0, grab.phase==='drag', grab.oz||0);
  for (const e of enemies) if (e.boss && !e.dead){
    if (e.state==='tongue' && e.phase==='warn'){
      const [tx,ty] = iso(e.tx,e.ty); ctx.strokeStyle = `rgba(255,70,50,${.5+.4*Math.sin(S.t*20)})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(tx,ty,.85*TW/Math.SQRT2,.85*TH/Math.SQRT2,0,0,Math.PI*2); ctx.stroke();
    }
    if (e.state==='tongue' && e.phase!=='warn') drawTongue(e.x, e.y, e.hx, e.hy, 0, false, BOSS_MOUTH);
    if (e.state==='stomp' && e.phase==='air'){
      const [jx,jy] = iso(e.jx,e.jy); ctx.strokeStyle = 'rgba(155,255,106,.75)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(jx,jy,4.6*TW/Math.SQRT2,4.6*TH/Math.SQRT2,0,0,Math.PI*2); ctx.stroke();
    }
  }
  drawAbilities();
  drawPowers();
  drawSwing();
  for (const it of items) drawItem(it);
  for (const p of particles){
    ctx.globalAlpha = Math.max(0, p.life/p.max); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (S.L.world){ drawFog(); drawCityLabels(); drawFloaters(); }
  drawNight();
  drawCountdown();
  drawMinimap();
  if (S.glacial>0){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const ga = Math.min(1, S.glacial);
    ctx.fillStyle = `rgba(190,235,255,${.12*ga})`; ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle = `rgba(255,255,255,${.85*ga})`;
    for (let i=0;i<90;i++){
      const x = ((i*137.5 + S.t*(20+i%7*6)) % (VW+40)) - 20, y = ((i*91.3 + S.t*(70+i%5*25)) % (VH+40)) - 20;
      ctx.beginPath(); ctx.arc(x, y, 1.2 + (i%4)*.6, 0, Math.PI*2); ctx.fill();
    }
  }
  if (S.flash && S.flash.t>0){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    if (S.flash && S.flash.t>0){ ctx.fillStyle = `rgba(255,240,150,${.4*S.flash.t/S.flash.max})`; ctx.fillRect(0,0,VW,VH); S.flash.t -= dt; }
  }
}

function tickParticles(dt){
  for (const [x,y] of lavaTiles){
    if (Math.random() < dt*.35){
      const [sx,sy] = iso(x+rnd(.2,.8), y+rnd(.2,.8));
      particles.push({x:sx, y:sy+2, vx:0, vy:-rnd(4,14), g:0, life:rnd(.4,.9), max:.9, c:S.L.haz.bub[Math.random()<.5?0:1], s:rnd(1.5,3.2)});
    }
  }
  for (const p of particles){ p.life -= dt; p.vy += p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt; }
  particles = particles.filter(p => p.life>0);
  if (particles.length>700) particles.splice(0, particles.length-700);
}

let last = performance.now(), fxT = 0;
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  S.t += dt;
  if (S.mode==='play') update(dt);
  else if (S.mode==='clear') { for (const c of chests) if (c.open) c.openT += dt; }
  tickParticles(dt);
  fxT += dt; if (fxT>.1){ fxT = 0; updFx(); }
  musicaInv();
  render(dt);
  requestAnimationFrame(frame);
}

// ---------- início ----------
function boot(data){
  let lvl = data && Number.isInteger(data.lvl) ? clamp(data.lvl,0,LEVELS.length-1) : 0;
  if (!mapOpen(lvl)) lvl = 0;
  if (data && Number.isInteger(data.score)) S.score = data.score;
  if (data && SKINS[data.skin]) S.skin = data.skin;
  buildLevel(lvl); updHUD(); menuScreen(lvl);
  requestAnimationFrame(t => { last = t; frame(t); });
}
try { window.claude?.hot?.snapshot?.(() => ({lvl:S.lvl, score:S.score, skin:S.skin})); } catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
