<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaves e Poções</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Signika:wght@400;600;700&display=swap">
<style>
/* Layout: estádio noturno em tela cheia; HUD em placas flutuantes nos cantos, telas de menu num cartão central */
:root{
  --night:#0d111c;
  --panel:rgba(18,22,38,.84);
  --panel2:#161b2e;
  --line:rgba(255,236,190,.14);
  --ink:#f4ecd8;
  --muted:#aeabc2;
  --gold:#ffc93c;
  --lava:#ff5a1f;
  --arena:#9a5cf0;
  --heart:#ff4d6d;
  --display:"Bagel Fat One","Arial Black",Impact,system-ui,sans-serif;
  --body:"Signika","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#cv{position:fixed;inset:0;display:block}

.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;pointer-events:none;z-index:2}
.plate{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lvl{font-family:var(--display);font-size:18px;color:var(--gold);letter-spacing:.01em}
.lvl span{color:var(--ink);font-family:var(--body);font-weight:600;font-size:14px}
.goal{font-size:13px;color:var(--muted);margin-top:2px}
.goal b{color:var(--gold)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.stats{display:flex;gap:14px;align-items:center}
.stat{display:flex;gap:5px;align-items:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.stat svg{width:20px;height:20px;display:block}
#lives{display:flex;gap:2px}
#lives svg{width:18px;height:18px}
#fx{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--panel);border:1px solid currentColor;font-variant-numeric:tabular-nums}
#mute{pointer-events:auto;background:none;border:0;color:var(--muted);font:600 12px var(--body);cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
#mute:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#bossbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:min(360px,calc(100% - 32px));z-index:3;pointer-events:none;text-align:center;font:400 17px var(--display);color:#b5f08a;text-shadow:0 2px 0 #000}
#bossbar .bar{height:12px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid #b5f08a;overflow:hidden;margin-top:4px}
#bossHp{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3f6e2a,#9bff6a);transition:width .15s}
@media (max-width:760px), (pointer:coarse){#bossbar{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 124px)}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translate(-50%,-6px);max-width:calc(100% - 32px);text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:600;font-size:15px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:3}
#toast.on{opacity:1;transform:translate(-50%,0)}

.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(8,10,18,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:5}
.card{width:min(560px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:26px 22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,9vw,58px);line-height:.95;margin:0;color:var(--gold);text-shadow:0 3px 0 #7a2e0e,0 0 28px rgba(255,110,40,.35);text-wrap:balance}
.card h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,6vw,36px);line-height:1;margin:0;color:var(--gold);text-wrap:balance}
.card p{margin:0;line-height:1.5;color:var(--ink)}
.sub{color:var(--muted)!important;font-size:15px}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;line-height:1.45;font-size:15px}
.dot{width:22px;height:22px;border-radius:6px;margin-top:1px}
.pots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;font-size:13px;color:var(--muted)}
.pots div{display:flex;gap:8px;align-items:center}
.pots i{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:6px}
.map{display:flex;flex-direction:column;gap:2px;text-align:left;background:#1d2340;border:2px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:7px 10px;color:var(--ink);font:400 15px var(--display);cursor:pointer;min-width:0}
.map small{font:600 11px var(--body);color:var(--muted);line-height:1.3}
.map[aria-pressed="true"]{border-color:var(--gold);border-left-color:var(--c);background:#2a2640}
.map:disabled{opacity:.45;cursor:not-allowed}
.map:focus-visible{outline:3px solid #fff;outline-offset:2px}
.skin:disabled{opacity:.5;cursor:not-allowed}
.creator{position:relative;align-self:center;width:345px;max-width:100%;aspect-ratio:345/360;padding:0;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#140b22;cursor:pointer;flex:none}
.creator canvas{display:block;width:100%;height:100%}
.creator span{position:absolute;left:12px;right:12px;bottom:14px;text-align:center;font:400 22px var(--display);color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.6)}
.creator span small{display:block;font:600 13px var(--body);color:var(--muted);text-shadow:none;margin-top:2px}
.creator:disabled{cursor:not-allowed}
.creator:disabled span{color:var(--muted)}
.creator:focus-visible{outline:3px solid #fff;outline-offset:3px}
.editor{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.editor canvas{width:150px;height:165px;border-radius:12px;border:1px solid var(--line)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;min-width:0}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.field.wide{grid-column:1/-1}
.field select,.field input[type=text]{font:600 14px var(--body);color:var(--ink);background:#1d2340;border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0}
.field input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;background:#1d2340;padding:2px}
.field select:focus-visible,.field input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
@media (max-width:520px){.editor{grid-template-columns:1fr}.editor canvas{justify-self:center}}
.meter{display:inline-flex;align-items:center;gap:5px;margin-right:8px;font-weight:700;font-size:12px}
.meter b{display:inline-block;width:64px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
.meter i{display:block;height:100%}
#invbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:3px;align-items:stretch;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 32px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px;z-index:3}
#invbar .slot{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:40px;padding:3px 3px;border-radius:8px;background:rgba(255,255,255,.04);border:0;color:var(--ink);font:inherit}
#invbar button.slot{cursor:pointer;background:rgba(255,255,255,.09)}
#invbar button.slot:focus-visible{outline:2px solid var(--gold)}
#invbar .slot i{width:12px;height:12px;border-radius:4px}
#invbar .slot b{font-size:14px;font-variant-numeric:tabular-nums}
#invbar .slot small{font-size:9px;color:var(--muted);white-space:nowrap}
#invbar .slot.empty{opacity:.45}
#invbar .sep{width:1px;background:var(--line);margin:0 3px}
@media (pointer:coarse){#invbar{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 230px)}}
.advbtn{position:absolute;left:16px;width:64px;height:56px;border-radius:14px;border:0;background:rgba(127,211,255,.9);color:#0a2233;font:400 12px var(--display);pointer-events:auto;box-shadow:0 4px 0 #2a6f8f}
.rec{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#1d2340;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.rec b{font:400 16px var(--display);color:var(--gold)}
.rec small{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.btn2{font:400 15px var(--display);background:var(--gold);color:#2a1606;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;flex:none}
.btn2:disabled{background:#3a3f55;color:#8f8aa8;cursor:not-allowed}
.btn2:focus-visible{outline:3px solid #fff;outline-offset:2px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;background:#1d2340;border:2px solid var(--line);border-radius:14px;padding:12px;color:var(--ink);cursor:pointer;min-width:0}
.mode b{font:400 22px var(--display);color:var(--gold)}
.mode small{font:600 13px var(--body);color:var(--muted);line-height:1.4}
.mode[aria-pressed="true"]{border-color:var(--gold);background:#2a2640}
.mode:focus-visible{outline:3px solid #fff;outline-offset:2px}
.genre{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font:400 15px var(--display);letter-spacing:.04em;color:#fff;background:linear-gradient(100deg,#ff5a1f,#9a5cf0);padding:5px 12px 4px;border-radius:8px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.genre small{font:700 10px var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.def{font-size:14px;color:var(--muted)!important;border-left:3px solid #9a5cf0;padding-left:10px}
.def b{color:var(--ink)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.keys{font-size:13px;color:var(--muted);line-height:1.8}
kbd{font:700 12px var(--body);background:#262c45;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 7px;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--display);font-size:20px;background:var(--gold);color:#2a1606;border:0;border-radius:12px;padding:12px 24px;cursor:pointer;box-shadow:0 4px 0 #9a6a12;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #9a6a12}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.big{font-family:var(--display);font-size:40px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}

#touch{position:fixed;inset:auto 0 0 0;height:240px;z-index:4;pointer-events:none}
#joyZone{position:absolute;left:0;bottom:0;width:55%;height:100%;pointer-events:auto}
#joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);left:90px;top:150px}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,201,60,.8)}
#btnJump{position:absolute;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:92px;height:92px;border-radius:50%;border:0;background:rgba(255,201,60,.85);color:#2a1606;font:400 18px var(--display);pointer-events:auto;box-shadow:0 5px 0 #9a6a12}
#btnAtk{position:absolute;right:128px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:72px;height:72px;border-radius:50%;border:0;background:rgba(255,95,95,.88);color:#2a0606;font:400 13px var(--display);pointer-events:auto;box-shadow:0 4px 0 #8a2424}
#btnRide{position:absolute;right:30px;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);width:62px;height:62px;border-radius:50%;border:0;background:rgba(216,65,58,.9);color:#2a0606;font:400 12px var(--display);pointer-events:auto;box-shadow:0 4px 0 #7a1a16}
#btnPoison{position:absolute;right:202px;bottom:calc(env(safe-area-inset-bottom,0px) + 200px);width:58px;height:58px;border-radius:50%;border:0;background:rgba(122,138,46,.92);color:#11140a;font:400 10px var(--display);pointer-events:auto;box-shadow:0 4px 0 #3e4716}
#btnUltra{position:absolute;right:30px;bottom:calc(env(safe-area-inset-bottom,0px) + 214px);width:62px;height:62px;border-radius:50%;border:0;background:linear-gradient(135deg,#ffe066,#ff6ae6);color:#2a0633;font:400 12px var(--display);pointer-events:auto;box-shadow:0 4px 0 #8a3a7a}
#btnUltra:disabled{filter:grayscale(1);opacity:.5}
#btnPower2{position:absolute;right:202px;bottom:calc(env(safe-area-inset-bottom,0px) + 122px);width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,201,60,.9);color:#2a1606;font:400 11px var(--display);pointer-events:auto;box-shadow:0 4px 0 #9a6a12}
#btnPower{position:absolute;right:120px;bottom:calc(env(safe-area-inset-bottom,0px) + 118px);width:72px;height:72px;border-radius:50%;border:0;background:rgba(192,123,255,.85);color:#1d0b33;font:400 14px var(--display);pointer-events:auto;box-shadow:0 4px 0 #5b2d8c}
.skins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.skin{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:#1d2340;border:2px solid var(--line);border-radius:14px;padding:10px;color:var(--ink);font:400 13px var(--body);cursor:pointer;min-width:0}
.skin[aria-pressed="true"]{border-color:var(--gold);background:#2a2640}
.skin:focus-visible{outline:3px solid #fff;outline-offset:2px}
.skin canvas{width:110px;height:120px;align-self:center}
.skin b{font:400 17px var(--display);color:var(--gold)}
.skin .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.skin .pw{font-weight:700;color:#d8b8ff}
.skin .sd{color:var(--muted);line-height:1.4}
@media (prefers-reduced-motion:reduce){#toast,.btn{transition:none}}
</style>

<canvas id="cv" aria-label="Mapa do jogo Chaves e Poções"></canvas>

<div class="hud" id="hud">
  <div class="plate">
    <div class="lvl"><span id="lvlPre">Mapa</span> <b id="lvlN">1</b> <span id="lvlName"></span></div>
    <div class="goal" id="goalTxt">CPadventure · Abra <b>todos os baús</b> da borda</div>
  </div>
  <div class="right">
    <div class="plate stats">
      <div id="lives" aria-label="Vidas"></div>
      <div class="stat" title="Chaves"><svg viewBox="0 0 24 24"><circle cx="7" cy="12" r="4.2" fill="none" stroke="#ffc93c" stroke-width="3"/><path d="M11 12h11M18 12v4M21 12v3" stroke="#ffc93c" stroke-width="3" stroke-linecap="round" fill="none"/></svg><b id="keysN">1</b></div>
      <div class="stat" title="Poções de veneno"><svg viewBox="0 0 24 24"><path d="M9 3h6v3h-1v12a2 2 0 0 1-4 0V6H9z" fill="#7a8a2e" stroke="#2a2f12" stroke-width="1.4"/><circle cx="12" cy="13" r="2" fill="#f4f0e6"/></svg><b id="poisonN">0</b></div>
      <div class="stat" title="Poções coletadas"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v5.5L5.5 15a5.5 5.5 0 0 0 4.7 8h3.6a5.5 5.5 0 0 0 4.7-8L14 8.5V3" fill="#3fa9ff" stroke="#cfe8ff" stroke-width="1.6" stroke-linejoin="round"/></svg><b id="potsN">0</b></div>
    </div>
    <div id="fx"></div>
    <button id="mute" type="button">Som: ligado</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="invbar" hidden></div>
<div id="bossbar" hidden><span>Zambery · <b id="bossNum" style="font-variant-numeric:tabular-nums">300/300</b></span><div class="bar"><i id="bossHp"></i></div></div>

<div id="touch" hidden>
  <div id="joyZone"><div id="joy"><div id="knob"></div></div></div>
  <button id="btnAtk" type="button">ATACAR</button>
  <button id="btnRide" type="button">DESCER</button>
  <button id="btnPower" type="button">PODER</button>
  <button id="btnPower2" type="button">PODER 2</button>
  <button id="btnUltra" type="button">ULTRA</button>
  <button id="btnPoison" type="button">VENENO</button>
  <button id="btnCraft" class="advbtn" type="button" style="bottom:calc(env(safe-area-inset-bottom,0px) + 250px)">CRIAR</button>
  <button id="btnEat" class="advbtn" type="button" style="bottom:calc(env(safe-area-inset-bottom,0px) + 318px)">COMER</button>
  <button id="btnSleep" class="advbtn" type="button" style="bottom:calc(env(safe-area-inset-bottom,0px) + 386px)">DORMIR</button>
  <button id="btnJump" type="button">PULAR</button>
</div>

<div class="overlay" id="overlay">
  <div class="card" id="card"></div>
</div>

<script>
(() => {
const TW = 64, TH = 32, ZPX = 28;
let W = 24, H = 15, CX = 12, CY = 7.5;  // mudam no Covil do Zambery
const ARENA_R = 2.75, ARENA_TIME = 3;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

const LEVELS = [
  {id:'floresta', name:'Floresta', perigo:'lava', chip:'#5fbf4a', nota:'',
   depth:3, width:7, arc:false, puddles:0, chests:4, fieldKeys:1, chestKeys:2, enemy:'landery', enemies:6,
   floor:['#3d7a3a','#3a7437','#42823e','#377035','#40803c','#3b7639','#44863f','#396f36'], seam:'rgba(15,40,15,.45)', decor:'flor',
   haz:{h:[14,40], s:100, l:[44,58], rim:'#3a130a', glow:'255,110,30', bub:['#ffd166','#ff7a1a']},
   bg:['#10241a','#07100b'], light:'255,210,140', side:['#4a3322','#35241a']},
  {id:'pantano', name:'Pântano', perigo:'lodo tóxico', chip:'#9bbf3a', nota:' · chão lento',
   depth:3, width:9, arc:true, puddles:0, chests:5, fieldKeys:1, chestKeys:3, enemy:'sapo', enemies:6, slow:.85,
   floor:['#4f5a2c','#4a5429','#566232','#465027','#525e2f','#4c572a','#59663a','#48522a'], seam:'rgba(20,25,10,.5)', decor:'junco',
   haz:{h:[85,115], s:70, l:[26,40], rim:'#141d08', glow:'130,255,80', bub:['#b6ff6a','#6fcf3a']},
   bg:['#16211a','#090f0b'], light:'170,255,150', side:['#3b3420','#2a2616']},
  {id:'caverna', name:'Caverna', perigo:'abismo', chip:'#9a8a78', nota:'',
   depth:4, width:9, arc:true, puddles:1, chests:6, fieldKeys:2, chestKeys:3, enemy:'deathrock', enemies:6,
   floor:['#4a4540','#45403b','#4f4a44','#413c37','#4c4742','#47423d','#534d46','#433e39'], seam:'rgba(10,8,6,.6)', decor:'caverna',
   haz:{h:[250,272], s:45, l:[7,16], rim:'#040208', glow:'130,100,220', bub:['#7a68d8','#3a2c6a']},
   bg:['#16131a','#070509'], light:'180,160,230', side:['#3a3430','#26211e']},
  {id:'gelo', name:'Gelo', perigo:'água congelante', chip:'#8fd3ff', nota:' · chão escorrega',
   depth:4, width:11, arc:true, puddles:2, chests:7, fieldKeys:2, chestKeys:4, enemy:'focafan', enemies:6, ice:true,
   floor:['#bfe3f2','#b5dcee','#c8e9f5','#acd6ea','#c2e5f3','#b9dff0','#cdebf6','#b0d9ec'], seam:'rgba(90,140,170,.45)', decor:'brilho',
   haz:{h:[198,215], s:75, l:[26,42], rim:'#0b2030', glow:'120,200,255', bub:['#e6f7ff','#8fd3ff']},

// EXTRA[categoria][id] = { label, ...funções de desenho }. Veja skins/README.md.
const EXTRA = {corpo:{}, chapeu:{}, cabelo:{}, olhos:{}, boca:{}, acessorio:{}};

function shadeHex(hex, k){
  const n = parseInt(hex.slice(1),16), m = k<0 ? 0 : 255, a = Math.abs(k);
  const ch = v => Math.round(v + (m-v)*a);
  return `rgb(${ch(n>>16)},${ch((n>>8)&255)},${ch(n&255)})`;
}

function drawCustom(g, c, f, st, weapon){
  const R = (x,y,w,h,col) => { g.fillStyle = col; g.fillRect(x,y,w,h); };
  const dark = shadeHex(c.roupa,-.45), det = c.detalhe;
  const bodyX = EXTRA.corpo[c.corpo];
  const block = bodyX ? !!bodyX.block : c.corpo==='blocos';
  const cy = block ? -35.5 : -31, top = block ? -44 : -39;
  const k = {c, f, st, cy, top, block, ex:f*2, ey:cy-1, my:cy+4.2, det, dark, R, shade:shadeHex,
             t:(typeof performance!=='undefined' ? performance.now()/1000 : 0)};
  const run = (fn) => { g.save(); g.lineCap = 'round'; g.lineJoin = 'round'; try { fn(g,k); } catch(e){ if (typeof window!=='undefined' && window.__errs) window.__errs.push(c.corpo+'/'+c.chapeu+'/'+c.cabelo+'/'+c.olhos+'/'+c.boca+'/'+c.acessorio+': '+e.message); } g.restore(); };
  const hook = (cat, part) => { const e = EXTRA[cat][c[cat]]; if (e && typeof e[part]==='function') run(e[part]); };
  g.lineCap = 'round'; g.lineJoin = 'round';

  hook('acessorio','back');
  if (weapon && c.poder==='gloower'){
    g.strokeStyle = '#cfd6e2'; g.lineWidth = 3; g.beginPath(); g.moveTo(-f*10,-5); g.lineTo(-f*3,-30); g.stroke();
    g.strokeStyle = '#ffc93c'; g.beginPath(); g.moveTo(-f*7,-27); g.lineTo(-f*1,-25); g.stroke();
  }
  // pés
  if (!(bodyX && bodyX.noFeet)){
    if (block){ R(-8,-6+st*.3,6,5,'#1b1c2a'); R(2,-6-st*.3,6,5,'#1b1c2a'); }
    else { g.fillStyle = '#1b1c2a'; g.beginPath(); g.ellipse(-4,-2+st*.4,4,2.6,0,0,Math.PI*2); g.ellipse(4,-2-st*.4,4,2.6,0,0,Math.PI*2); g.fill(); }
  }
  // corpo
  g.fillStyle = c.roupa; g.strokeStyle = dark; g.lineWidth = 2;
  if (bodyX) run(bodyX.draw);
  else if (c.corpo==='manto'){
    g.beginPath(); g.moveTo(-7,-25); g.lineTo(7,-25); g.lineTo(12,-3); g.lineTo(-12,-3); g.closePath(); g.fill(); g.stroke(); R(-9.5,-12,19,2.5,det);
  } else if (c.corpo==='armadura'){
    g.beginPath(); g.moveTo(-9,-26); g.lineTo(9,-26); g.lineTo(10,-4); g.lineTo(-10,-4); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(-4,-23); g.lineTo(-5,-15); g.stroke(); R(-10,-13,20,3,det);
  } else {
    R(-7,-12,5,7,dark); R(2,-12,5,7,dark); R(-12,-25,3,12,c.pele); R(9,-25,3,12,c.pele);
    R(-9,-27,18,16,c.roupa); R(-9,-27,3,16,dark); R(-9,-16,18,3,det);
  }
  hook('acessorio','body');
  // arma na mão
  g.lineCap = 'round';
  if (weapon && c.poder==='caio'){
    g.strokeStyle = '#e4e9f2'; g.lineWidth = 3; g.beginPath(); g.moveTo(f*12,-12); g.lineTo(f*15,-36); g.stroke();
    g.strokeStyle = '#ffd23f'; g.beginPath(); g.moveTo(f*8.5,-12.5); g.lineTo(f*15.5,-11.5); g.stroke();
    g.strokeStyle = '#7a4b25'; g.beginPath(); g.moveTo(f*12,-11); g.lineTo(f*11.4,-6); g.stroke();
  } else if (weapon && c.poder==='barry'){
    R(f*13-1.5,-50,3,48,'#c99a2e'); R(f*13-6,-50,12,3,'#ffc93c'); R(f*13-6,-58,3,8,'#ffc93c'); R(f*13-1.5,-60,3,10,'#ffc93c'); R(f*13+3,-58,3,8,'#ffc93c');
  } else if (weapon && typeof POWERS!=='undefined' && POWERS[c.poder]){
    // cajado genérico com a cor do poder
    g.strokeStyle = '#7a4b25'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(f*11,-4); g.lineTo(f*13,-32); g.stroke();
    const col = POWERS[c.poder].cor || '#ffc93c';
    g.fillStyle = col; g.beginPath(); g.arc(f*13.2,-35,3.6,0,Math.PI*2); g.fill();
    g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.arc(f*12.2,-36,1.2,0,Math.PI*2); g.fill();
  }
  // cabeça
  if (block) R(-9,-44,18,17,c.pele); else { g.fillStyle = c.pele; g.beginPath(); g.arc(0,-31,8,0,Math.PI*2); g.fill(); }
  // cabelo
  const hairX = EXTRA.cabelo[c.cabelo];
  if (hairX) run(hairX.draw);
  else if (c.cabelo==='marge'){
    for (const sx of [-1,1]){ const x0 = sx<0 ? -16 : 9; R(x0,top-18,7,32,det); R(x0+1,top-24,5,6,det); R(x0+2,top-27,3,3,det); R(x0+1,top-14,2,20,shadeHex(det,.25)); }
  } else if (c.cabelo==='curto'){
    if (block) R(-9,-44,18,4,det);
    else { g.fillStyle = det; g.beginPath(); g.arc(0,-32,8.6,Math.PI*1.02,Math.PI*1.98); g.closePath(); g.fill(); }
  }
  // chapéus que ficam atrás do rosto
  const hatX = EXTRA.chapeu[c.chapeu];
  if (hatX && hatX.beforeFace) run(hatX.draw);
  if (c.chapeu==='capacete'){
    g.fillStyle = '#cfd6e2'; g.strokeStyle = '#4b5566'; g.lineWidth = 2;
    g.beginPath(); g.arc(0,cy-1,block?11.5:10,Math.PI,0); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = det; g.lineWidth = 4.5; g.beginPath(); g.moveTo(0,cy-11); g.quadraticCurveTo(-f*8,cy-20,-f*14,cy-12); g.stroke();
  }
  // olhos
  const ex = k.ex, ey = k.ey;
  const eyeX = EXTRA.olhos[c.olhos];
  if (eyeX) run(eyeX.draw);
  else if (c.olhos==='normal'){ g.fillStyle = '#1b1c2a'; g.beginPath(); g.arc(ex-3,ey,1.4,0,Math.PI*2); g.arc(ex+3,ey,1.4,0,Math.PI*2); g.fill(); }
  else if (c.olhos==='palito'){ g.strokeStyle = '#1b1c2a'; g.lineWidth = 1.8; g.beginPath(); g.moveTo(ex-3,ey-2); g.lineTo(ex-3,ey+1.5); g.moveTo(ex+3,ey-2); g.lineTo(ex+3,ey+1.5); g.stroke(); }
  else if (c.olhos==='ovais'){
    for (const o of [-3.2,3.2]){
      g.fillStyle = '#fff'; g.strokeStyle = '#1b1c2a'; g.lineWidth = .8; g.beginPath(); g.ellipse(ex+o,ey-1,2.8,4,0,0,Math.PI*2); g.fill(); g.stroke();
      g.fillStyle = '#12161f'; g.beginPath(); g.ellipse(ex+o+f*.6,ey-.5,1.3,2.3,0,0,Math.PI*2); g.fill();
    }
  } else if (c.olhos==='um'){ g.fillStyle = '#fff'; g.beginPath(); g.ellipse(ex,ey-1,4.5,3.8,0,0,Math.PI*2); g.fill(); g.fillStyle = '#15151f'; g.beginPath(); g.arc(ex+f*1.2,ey-1,2,0,Math.PI*2); g.fill(); }
  // boca
  const my = k.my; g.strokeStyle = '#1b1c2a'; g.lineWidth = 1.3;
  const mouthX = EXTRA.boca[c.boca];
  if (mouthX) run(mouthX.draw);
  else if (c.boca==='sorriso'){ g.beginPath(); g.moveTo(ex-2.8,my-.6); g.quadraticCurveTo(ex,my+1.6,ex+2.8,my-.6); g.stroke(); }
  else if (c.boca==='zigzag'){ g.lineJoin = 'miter'; g.beginPath(); g.moveTo(ex-4,my); for (let i=1;i<=6;i++) g.lineTo(ex-4+i*1.33, i%2 ? my+1.6 : my); g.stroke(); g.lineJoin = 'round'; }
  else if (c.boca==='torta'){ g.beginPath(); g.moveTo(ex-3.5,my-1); g.lineTo(ex,my); g.lineTo(ex+3.5,my+1.3); g.stroke(); }
  hook('acessorio','face');
  // chapéus
  if (hatX && !hatX.beforeFace) run(hatX.draw);
  else if (c.chapeu==='mago'){
    g.fillStyle = det; g.beginPath(); g.ellipse(0,top+2,12,3.5,0,0,Math.PI*2); g.fill();
    g.beginPath(); g.moveTo(-8,top+1); g.lineTo(8,top+1); g.lineTo(-f*6,top-20); g.closePath(); g.fill();
    g.fillStyle = '#ffc93c'; g.beginPath(); g.arc(-f*6,top-20,2.4,0,Math.PI*2); g.fill();
  } else if (c.chapeu==='pirata'){ R(-9,top-6,18,6,'#15151f'); R(-6,top-11,12,5,'#15151f'); R(-1,top-9,2,2,'#f4f4f4'); }
  else if (c.chapeu==='coroa'){
    g.fillStyle = '#ffc93c'; g.strokeStyle = '#9a6a12'; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(-7,top+1); g.lineTo(-7,top-6); g.lineTo(-3.5,top-2.5); g.lineTo(0,top-8); g.lineTo(3.5,top-2.5); g.lineTo(7,top-6); g.lineTo(7,top+1); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#ff4d6d'; g.beginPath(); g.arc(0,top-1.5,1.5,0,Math.PI*2); g.fill();
  }
  hook('acessorio','front');
}

    g.moveTo(-bw, t-3);

    g.quadraticCurveTo(0, t+3, w, t+1.5);
    g.quadraticCurveTo(bw-2, t+2, bw, t-3);
    g.quadraticCurveTo(bw-1, t+4.5, 0, t+4.5);
    g.quadraticCurveTo(-bw+1, t+4.5, -bw, t-3);
    g.closePath(); g.fill(); g.stroke();
    // estrelinha dourada na fita
    g.fillStyle = '#ffc93c'; g.beginPath(); g.arc(k.f*2.5, t-1.3, 1.1, 0, Math.PI*2); g.fill();
  },
};

// Capacete viking com chifres
EXTRA.chapeu.x_viking = {
  label: 'Capacete viking',
  beforeFace: true,
  draw(g, k){
    const t = k.top, w = k.block ? 10.5 : 9.5, base = t + (k.block ? 5 : 3.5);
    // chifres (atrás do capacete)
    for (const s of [-1, 1]){
      g.fillStyle = '#f3ead2'; g.strokeStyle = '#8a7a58'; g.lineWidth = 1.4;
      g.beginPath();
      g.moveTo(s*(w-2.5), base-3.5);
      g.quadraticCurveTo(s*(w+6), base-4, s*(w+6), t-9);
      g.quadraticCurveTo(s*(w+3), base-7.5, s*(w-2), base);
      g.closePath(); g.fill(); g.stroke();
      g.strokeStyle = '#c9b88e'; g.lineWidth = .9;
      g.beginPath(); g.moveTo(s*(w+2.2), base-3.2); g.lineTo(s*(w+3.8), base-5.2); g.stroke();
    }
    // cúpula de metal
    g.fillStyle = '#b9c2cf'; g.strokeStyle = '#4b5566'; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(-w, base); g.quadraticCurveTo(-w, t-7, 0, t-7); g.quadraticCurveTo(w, t-7, w, base); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.ellipse(-k.f*3.5, t-2.5, 1.6, 3, -k.f*.5, 0, Math.PI*2); g.fill();
    // faixa central e aro na cor de detalhe
    g.fillStyle = k.det; g.strokeStyle = k.shade(k.det, -.5); g.lineWidth = 1.1;
    g.beginPath(); g.rect(-1.6, t-7, 3.2, base-t+7); g.fill(); g.stroke();
    g.beginPath(); g.rect(-w-.5, base-2, 2*w+1, 3.5); g.fill(); g.stroke();
    // rebites
    g.fillStyle = '#e8edf4';
    for (const x of [-w+2.5, -w/2, w/2, w-2.5]){ g.beginPath(); g.arc(x, base-.3, .8, 0, Math.PI*2); g.fill(); }
  },
};

// Chapéu de chef
EXTRA.chapeu.x_chef = {
  label: 'Chapéu de chef',
  draw(g, k){
    const t = k.top, w = k.block ? 7.5 : 6.5, lin = '#9aa2ad';
    g.fillStyle = '#ffffff'; g.strokeStyle = lin; g.lineWidth = 1.4;
    // parte fofa (três bolhas)
    const puff = () => { g.beginPath();
      g.moveTo(-w+5.6, t-9); g.arc(-w+1, t-9, 4.6, 0, Math.PI*2);
      g.moveTo(w+3.6, t-9); g.arc(w-1, t-9, 4.6, 0, Math.PI*2);
      g.moveTo(5.5, t-12); g.arc(0, t-12, 5.5, 0, Math.PI*2); };
    g.lineWidth = 2.8; puff(); g.stroke(); puff(); g.fill();
    g.strokeStyle = '#dde2e8'; g.lineWidth = 1;
    g.beginPath(); g.arc(-w+1, t-9, 3, Math.PI*.6, Math.PI*1.1); g.stroke();
    g.beginPath(); g.arc(w-1, t-9, 3, Math.PI*1.9, Math.PI*2.4); g.stroke();
    g.strokeStyle = lin; g.lineWidth = 1.4;
    // corpo cilíndrico

    k.R(-w, t-2.2, 2*w, 3.2, k.det);

// Tiara de flores
EXTRA.chapeu.x_tiara_flores = {
  label: 'Tiara de flores',
  draw(g, k){
    const t = k.top;
    const pts = k.block
      ? [[-9,t+1.5],[-4.5,t],[0,t-.5],[4.5,t],[9,t+1.5]]
      : [[-7.5,t+4],[-4.2,t+1],[0,t],[4.2,t+1],[7.5,t+4]];
    // ramo verde
    g.strokeStyle = '#2f7a35'; g.lineWidth = 2.2;
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (let i=1;i<pts.length;i++) g.lineTo(pts[i][0], pts[i][1]);
    g.stroke();
    // folhinhas
    g.fillStyle = '#4caf50';
    for (let i=0;i<pts.length-1;i++){
      const mx = (pts[i][0]+pts[i+1][0])/2, my = (pts[i][1]+pts[i+1][1])/2;
      g.beginPath(); g.ellipse(mx, my-1.4, 1.2, 2.2, (i%2?.6:-.6), 0, Math.PI*2); g.fill();
    }
    // flores: alterna cor de detalhe, rosa e amarelo
    const cores = [k.det, '#ff7fa8', '#ffd84d', '#ff7fa8', k.det];
    pts.forEach(([x, y], i) => {
      const r = i===2 ? 3.4 : 2.7, c = cores[i];
      const petals = () => { g.beginPath();
        for (let p=0;p<5;p++){
          const a = p/5*Math.PI*2 - Math.PI/2, px = x+Math.cos(a)*r*.62, py = y+Math.sin(a)*r*.62;
          g.moveTo(px + r*.52, py); g.arc(px, py, r*.52, 0, Math.PI*2);
        } };
      g.strokeStyle = k.shade(c, -.5); g.lineWidth = 1.6; petals(); g.stroke();
      g.fillStyle = c; petals(); g.fill();
      g.fillStyle = i===2 ? '#e0562c' : '#fff3b0';
      g.beginPath(); g.arc(x, y, r*.38, 0, Math.PI*2); g.fill();
    });
  },
};

// ---- rosto.js ----
// ===== Rosto: olhos e bocas extras (Chaves e Poções) =====
// Olhos centrados em k.ex (padrão ex-3 e ex+3) na altura k.ey; boca em k.my.

(function(){
  const INK = '#1b1c2a';

  // ---------- OLHOS ----------

  EXTRA.olhos.x_bravo = {
    label: 'Bravo',
    draw(g, k){
      const ex = k.ex, ey = k.ey;
      g.fillStyle = INK;
      g.beginPath(); g.arc(ex-3, ey+.4, 1.3, 0, Math.PI*2); g.arc(ex+3, ey+.4, 1.3, 0, Math.PI*2); g.fill();
      // sobrancelhas grossas inclinadas para o centro
      g.strokeStyle = INK; g.lineWidth = 1.8;
      g.beginPath();
      g.moveTo(ex-5, ey-3.2); g.lineTo(ex-1.2, ey-1.6);
      g.moveTo(ex+5, ey-3.2); g.lineTo(ex+1.2, ey-1.6);
      g.stroke();
    }
  };

  EXTRA.olhos.x_sonolento = {
    label: 'Sonolento',
    draw(g, k){
      const ex = k.ex, ey = k.ey;
      for (const o of [-3, 3]){
        const x = ex+o;
        // olho meio fechado: meia-lua de baixo com pálpebra reta
        g.fillStyle = '#fff'; g.beginPath(); g.arc(x, ey, 2.1, 0, Math.PI); g.closePath(); g.fill();
        g.fillStyle = INK; g.beginPath(); g.arc(x+k.f*.3, ey+.2, 1, 0, Math.PI); g.closePath(); g.fill();
        g.strokeStyle = INK; g.lineWidth = 1.2;
        g.beginPath(); g.moveTo(x-2.5, ey); g.lineTo(x+2.5, ey); g.stroke();
        g.lineWidth = .7; g.beginPath(); g.arc(x, ey, 2.1, 0, Math.PI); g.stroke();
      }
    }
  };

  const star = (g, x, y, r) => {
    g.beginPath();
    for (let i = 0; i < 10; i++){
      const a = -Math.PI/2 + i*Math.PI/5, rr = i%2 ? r*.45 : r;
      g.lineTo(x + Math.cos(a)*rr, y + Math.sin(a)*rr);
    }
    g.closePath();
  };

  EXTRA.olhos.x_estrelas = {
    label: 'Estrelas',
    draw(g, k){
      const ex = k.ex, ey = k.ey;
      g.fillStyle = '#ffd23f'; g.strokeStyle = '#8a5a00'; g.lineWidth = .7;
      for (const o of [-3.2, 3.2]){ star(g, ex+o, ey-.3, 2.9); g.fill(); g.stroke(); }
    }
  };

  const heart = (g, x, y, s) => {
    g.beginPath();
    g.moveTo(x, y + s*.9);
    g.bezierCurveTo(x - s*1.4, y - s*.1, x - s*.8, y - s*1.2, x, y - s*.45);
    g.bezierCurveTo(x + s*.8, y - s*1.2, x + s*1.4, y - s*.1, x, y + s*.9);
    g.closePath();
  };

  EXTRA.olhos.x_coracoes = {
    label: 'Corações',
    draw(g, k){
      const ex = k.ex, ey = k.ey;
      g.fillStyle = '#ff3b6b'; g.strokeStyle = '#7a0f2a'; g.lineWidth = .7;
      for (const o of [-3.2, 3.2]){ heart(g, ex+o, ey, 2.4); g.fill(); g.stroke(); }
      g.fillStyle = 'rgba(255,255,255,.8)';
      for (const o of [-3.2, 3.2]){ g.beginPath(); g.arc(ex+o-.9, ey-.9, .5, 0, Math.PI*2); g.fill(); }
    }
  };

  EXTRA.olhos.x_espiral = {
    label: 'Espiral hipnotizada',
    draw(g, k){
      const ex = k.ex, ey = k.ey;
      for (const o of [-3.2, 3.2]){
        const x = ex+o;
        g.fillStyle = '#fff'; g.strokeStyle = INK; g.lineWidth = .7;
        g.beginPath(); g.arc(x, ey-.3, 2.7, 0, Math.PI*2); g.fill(); g.stroke();
        // espiral (gira devagar)
        const rot = (k.t || 0) * 3 * (o < 0 ? 1 : -1);
        g.strokeStyle = '#7a2cc0'; g.lineWidth = .75; g.beginPath();
        for (let i = 0; i <= 28; i++){
          const a = rot + i*.45, r = .1 + i*.08;
          const px = x + Math.cos(a)*r, py = ey-.3 + Math.sin(a)*r;
          if (i) g.lineTo(px, py); else g.moveTo(px, py);
        }
        g.stroke();
      }
    }
  };

  EXTRA.olhos.x_nerd = {
    label: 'Óculos de nerd',
    draw(g, k){
      const ex = k.ex, ey = k.ey, f = k.f;
      // olhos grandes atrás das lentes
      for (const o of [-3.3, 3.3]){
        g.fillStyle = 'rgba(200,235,255,.85)'; g.beginPath(); g.arc(ex+o, ey-.3, 3, 0, Math.PI*2); g.fill();
        g.fillStyle = '#fff'; g.beginPath(); g.arc(ex+o, ey-.3, 2.1, 0, Math.PI*2); g.fill();
        g.fillStyle = INK; g.beginPath(); g.arc(ex+o+f*.5, ey-.2, 1.2, 0, Math.PI*2); g.fill();
        g.fillStyle = '#fff'; g.beginPath(); g.arc(ex+o+f*.5-.4, ey-.7, .4, 0, Math.PI*2); g.fill();
      }
      // armação grossa
      g.strokeStyle = INK; g.lineWidth = 1.2;
      g.beginPath(); g.arc(ex-3.3, ey-.3, 3, 0, Math.PI*2); g.stroke();
      g.beginPath(); g.arc(ex+3.3, ey-.3, 3, 0, Math.PI*2); g.stroke();
      g.beginPath(); g.moveTo(ex-.8, ey-.9); g.quadraticCurveTo(ex, ey-1.6, ex+.8, ey-.9); g.stroke();
      // haste que vai para trás da cabeça
      g.beginPath(); g.moveTo(ex-f*6.3, ey-.6); g.lineTo(ex-f*8.5, ey-1.2); g.stroke();
    }
  };

  // ---------- BOCAS ----------

  EXTRA.boca.x_dentuco = {
    label: 'Dentuço',
    draw(g, k){
      const ex = k.ex, my = k.my;
      g.fillStyle = '#fff'; g.strokeStyle = INK; g.lineWidth = .7;
      g.fillRect(ex-1.7, my-.4, 1.6, 2.4); g.strokeRect(ex-1.7, my-.4, 1.6, 2.4);
      g.fillRect(ex+.1, my-.4, 1.6, 2.4); g.strokeRect(ex+.1, my-.4, 1.6, 2.4);
      g.lineWidth = 1.3;
      g.beginPath(); g.moveTo(ex-3.2, my-1); g.quadraticCurveTo(ex, my+.3, ex+3.2, my-1); g.stroke();
    }
  };

  EXTRA.boca.x_lingua = {
    label: 'Língua para fora',
    draw(g, k){
      const ex = k.ex, my = k.my, f = k.f;
      // língua
      g.fillStyle = '#ff6f8e'; g.strokeStyle = '#8a1c38'; g.lineWidth = .7;
      g.beginPath();
      g.moveTo(ex+f*.2, my);
      g.lineTo(ex+f*.1, my+1.6);
      g.arc(ex+f*1.6, my+1.6, 1.5, Math.PI, 0, true);
      g.lineTo(ex+f*3.1, my);
      g.closePath(); g.fill(); g.stroke();
      g.beginPath(); g.moveTo(ex+f*1.6, my+.4); g.lineTo(ex+f*1.6, my+1.9); g.stroke();
      // sorriso por cima
      g.strokeStyle = INK; g.lineWidth = 1.3;
      g.beginPath(); g.moveTo(ex-3, my-.8); g.quadraticCurveTo(ex, my+.9, ex+3, my-.8); g.stroke();
    }
  };

  EXTRA.boca.x_surpreso = {
    label: 'Surpreso (O)',
    draw(g, k){
      const ex = k.ex, my = k.my;
      g.fillStyle = '#5a1020'; g.strokeStyle = INK; g.lineWidth = 1.1;
      g.beginPath(); g.ellipse(ex, my+.4, 1.5, 2, 0, 0, Math.PI*2); g.fill(); g.stroke();
      g.fillStyle = '#ff6f8e'; g.beginPath(); g.ellipse(ex, my+1.5, .9, .5, 0, 0, Math.PI*2); g.fill();
    }
  };

  EXTRA.boca.x_vampiro = {
    label: 'Presas de vampiro',
    draw(g, k){
      const ex = k.ex, my = k.my;
      g.fillStyle = '#fff'; g.strokeStyle = INK; g.lineWidth = .6;
      for (const o of [-1.6, 1.6]){
        g.beginPath(); g.moveTo(ex+o-.8, my-.1); g.lineTo(ex+o, my+2.3); g.lineTo(ex+o+.8, my-.1); g.closePath(); g.fill(); g.stroke();
      }
      g.lineWidth = 1.3;
      g.beginPath(); g.moveTo(ex-3.3, my-.9); g.quadraticCurveTo(ex, my+.5, ex+3.3, my-.9); g.stroke();
    }
  };

  EXTRA.boca.x_bigode = {
    label: 'Bigode e sorriso',
    draw(g, k){
      const ex = k.ex, my = k.my;
      // sorriso
      g.strokeStyle = INK; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(ex-2.4, my+.9); g.quadraticCurveTo(ex, my+2.8, ex+2.4, my+.9); g.stroke();
      // bigode na cor de detalhe (combina com o cabelo)
      const col = k.det;
      g.fillStyle = col; g.strokeStyle = k.shade(col, -.5); g.lineWidth = .7;
      g.beginPath();
      g.moveTo(ex, my-2);
      g.bezierCurveTo(ex-1.5, my-3, ex-4, my-2.4, ex-5, my-.8);
      g.bezierCurveTo(ex-3.5, my-.3, ex-1.5, my-.4, ex, my-1);
      g.bezierCurveTo(ex+1.5, my-.4, ex+3.5, my-.3, ex+5, my-.8);
      g.bezierCurveTo(ex+4, my-2.4, ex+1.5, my-3, ex, my-2);
      g.closePath(); g.fill(); g.stroke();
    }
  };

  EXTRA.boca.x_sorrisao = {
    label: 'Sorrisão com dentes',
    draw(g, k){
      const ex = k.ex, my = k.my;
      // boca aberta em D
      g.fillStyle = '#5a1020';
      g.beginPath(); g.moveTo(ex-3.6, my-1); g.lineTo(ex+3.6, my-1);
      g.quadraticCurveTo(ex+3.4, my+3, ex, my+3); g.quadraticCurveTo(ex-3.4, my+3, ex-3.6, my-1);
      g.closePath(); g.fill();
      g.save(); g.clip();
      g.fillStyle = '#fff'; g.fillRect(ex-4, my-1, 8, 1.4);
      g.fillStyle = '#ff6f8e'; g.beginPath(); g.ellipse(ex, my+3, 2, 1.2, 0, 0, Math.PI*2); g.fill();
      g.strokeStyle = '#c9c9c9'; g.lineWidth = .4;
      g.beginPath(); for (const o of [-1.8, 0, 1.8]){ g.moveTo(ex+o, my-1); g.lineTo(ex+o, my+.4); } g.stroke();
      g.restore();
      g.strokeStyle = INK; g.lineWidth = 1;
      g.beginPath(); g.moveTo(ex-3.6, my-1); g.lineTo(ex+3.6, my-1);
      g.quadraticCurveTo(ex+3.4, my+3, ex, my+3); g.quadraticCurveTo(ex-3.4, my+3, ex-3.6, my-1);
      g.closePath(); g.stroke();
    }
  };
})();

// ---- cabelo.js ----
// ===== Cabelos extras — Chaves e Poções =====
// Todos usam k.det (cor escolhida pelo jogador) e k.shade para sombra/brilho.
// Desenhados depois da cabeça e antes dos olhos: nunca pintam a área dos olhos/boca.
(function(){
  const PI = Math.PI;
  // cores derivadas
  const cores = (k) => ({ base:k.det, esc:k.shade(k.det,-.45), luz:k.shade(k.det,.3) });
  // "capinha" de cabelo no topo da cabeça (base comum de vários penteados)
  function capa(g, k, testa){
    const c = cores(k);
    g.fillStyle = c.base; g.strokeStyle = c.esc; g.lineWidth = 1.3;
    if (k.block){
      const h = testa || 5;
      g.beginPath(); g.rect(-9.5, k.top-1, 19, h+1); g.fill(); g.stroke();
    } else {
      // topo + costeletas, com a testa livre (linha do cabelo em cy-4.5)
      g.beginPath(); g.arc(0, -31, 8.7, PI*1.0, PI*2.0);
      g.lineTo(7.6, -30.5); g.quadraticCurveTo(0, -40.5, -7.6, -30.5); g.closePath(); g.fill(); g.stroke();
    }
  }
  // linha de brilho curta
  function brilho(g, k, x1, y1, xc, yc, x2, y2, w){
    g.strokeStyle = cores(k).luz; g.lineWidth = w || 1.3;
    g.beginPath(); g.moveTo(x1,y1); g.quadraticCurveTo(xc,yc,x2,y2); g.stroke();
  }

  // 1) Moicano: crista de espetos no meio, laterais raspadas
  EXTRA.cabelo.x_moicano = {
    label: 'Moicano',
    draw(g, k){
      const c = cores(k), t = k.top;
      // laterais raspadas (sombra suave)
      g.globalAlpha = .35; g.fillStyle = c.esc;
      if (k.block) g.fillRect(-9, t, 18, 3.5);
      else { g.beginPath(); g.arc(0,-31.5,8,PI*1.08,PI*1.92); g.closePath(); g.fill(); }
      g.globalAlpha = 1;
      // crista
      const pts = [[-4.5,-1],[-3.8,-8],[-1.8,-3],[-.6,-12],[1.2,-4],[3,-10],[4.2,-3],[6,-6.5],[5,1]];
      g.fillStyle = c.base; g.strokeStyle = c.esc; g.lineWidth = 1.3;
      g.beginPath(); g.moveTo(-3.2*k.f, t+2);
      for (const [x,y] of pts) g.lineTo(x*k.f, t+y*1.1);
      g.lineTo(3.2*k.f, t+2); g.closePath(); g.fill(); g.stroke();
      brilho(g, k, -1*k.f, t-1, -.2*k.f, t-6, -.5*k.f, t-9, 1);
    }
  };

  // 2) Rabo de cavalo: vai para trás (lado oposto a k.f)
  EXTRA.cabelo.x_rabo = {
    label: 'Rabo de cavalo',
    draw(g, k){
      const c = cores(k), b = -k.f, hw = k.block ? 9.5 : 8.3;
      const ay = k.block ? k.top+4 : k.cy-5;
      // rabo
      g.fillStyle = c.base; g.strokeStyle = c.esc; g.lineWidth = 1.3;
      g.beginPath();
      g.moveTo(b*(hw-1), ay-2.5);
      g.quadraticCurveTo(b*(hw+9), ay-4, b*(hw+7), ay+9);
      g.quadraticCurveTo(b*(hw+6), ay+14, b*(hw+2), ay+16);
      g.quadraticCurveTo(b*(hw+4), ay+10, b*(hw+1), ay+3);
      g.quadraticCurveTo(b*hw, ay+1, b*(hw-1), ay+1.5);
      g.closePath(); g.fill(); g.stroke();
      brilho(g, k, b*(hw+2), ay-1.5, b*(hw+6), ay, b*(hw+5), ay+8, 1.1);
      // topo
      capa(g, k, 4.5);
      // franjinha lateral puxada para trás
      g.fillStyle = c.base;
      if (!k.block){ g.beginPath(); g.moveTo(b*8.2,-33); g.quadraticCurveTo(b*2,-37.5,k.f*6,-35); g.lineTo(k.f*7,-37); g.lineTo(b*6,-38); g.closePath(); g.fill(); }
      // elástico
      g.fillStyle = k.c.roupa; g.strokeStyle = k.dark; g.lineWidth = 1;
      g.beginPath(); g.ellipse(b*(hw+.8), ay-.5, 1.6, 2.4, b*.4, 0, PI*2); g.fill(); g.stroke();
      brilho(g, k, -3*k.f, k.top+1.2, 0, k.top, 3*k.f, k.top+1.2, 1.1);
    }
  };

  // 3) Black power: nuvem grande e volumosa em volta da cabeça, rosto livre
  EXTRA.cabelo.x_black = {
    label: 'Black power',
    draw(g, k){
      const c = cores(k), cy = k.block ? k.cy-3 : k.cy-3.5, R = k.block ? 14 : 13;
      // recorte: não pinta a área do rosto
      g.beginPath(); g.rect(-60,-120,120,140);
      if (k.block) g.rect(-9, k.top+4.5, 18, 30);
      else g.rect(-7.9, k.cy-4.8, 15.8, 30);
      g.clip('evenodd');
      const bolas = [];
      const n = 11;
      for (let i=0;i<n;i++){
        const a = PI*.72 + i/(n-1)*PI*1.56;
        bolas.push([Math.cos(a)*R*.78, cy+Math.sin(a)*R*.72, R*.42]);
      }
      bolas.push([0, cy-1, R*.8]);
      g.fillStyle = c.esc; g.beginPath();
      for (const [x,y,r] of bolas){ g.moveTo(x+r+1.3,y); g.arc(x,y,r+1.3,0,PI*2); }
      g.fill();
      g.fillStyle = c.base; g.beginPath();
      for (const [x,y,r] of bolas){ g.moveTo(x+r,y); g.arc(x,y,r,0,PI*2); }
      g.fill();
      // cachinhos de brilho
      g.strokeStyle = c.luz; g.lineWidth = 1.1;
      for (const [x,y] of [[-6,cy-8],[1,cy-10.5],[7,cy-7],[-10,cy-1]]){
        g.beginPath(); g.arc(x*k.f, y, 1.8, PI*1.1, PI*1.9); g.stroke();
      }
    }
  };

  // 4) Franja longa: mecha que desce por um lado do rosto, sem tampar o resto
  EXTRA.cabelo.x_franja = {
    label: 'Franja longa',
    draw(g, k){
      const c = cores(k), f = k.f, b = -f;
      capa(g, k, 4.5);
      g.fillStyle = c.base; g.strokeStyle = c.esc; g.lineWidth = 1.3;
      g.beginPath();
      if (k.block){
        g.moveTo(f*9.5, k.top+4);
        g.quadraticCurveTo(f*2, k.top+4, b*3, k.ey-1);
        g.quadraticCurveTo(b*5, k.ey+4, b*6.5, k.my+3);
        g.lineTo(b*10.5, k.my+2);
        g.lineTo(b*10.5, k.top-1.5);
        g.quadraticCurveTo(f*2, k.top-2.5, f*9.5, k.top+1);
      } else {
        g.moveTo(f*8.3, -35);
        g.quadraticCurveTo(f*2, -35.5, b*3.2, k.ey-.8);
        g.quadraticCurveTo(b*5.5, k.ey+4, b*6, k.my+3.5);
        g.quadraticCurveTo(b*9.5, k.my, b*9.3, -32);
        g.quadraticCurveTo(b*8, -40.5, f*1, -40.3);
        g.quadraticCurveTo(f*7, -39.5, f*8.3, -35);
      }
      g.closePath(); g.fill(); g.stroke();
      // mechas e brilho
      g.strokeStyle = c.esc; g.lineWidth = .9;
      g.beginPath(); g.moveTo(b*1, k.top+3); g.quadraticCurveTo(b*5, k.ey-2, b*7, k.my+1); g.stroke();
      brilho(g, k, f*4, k.top+1.3, b*1, k.top+.5, b*5, k.top+3, 1.2);
    }
  };

  // 5) Trancinhas: duas tranças caindo dos lados da cabeça
  EXTRA.cabelo.x_trancas = {
    label: 'Trancinhas',
    draw(g, k){
      const c = cores(k), hw = k.block ? 10 : 8.6;
      const y0 = k.block ? k.top+4 : k.cy-3;
      for (const s of [-1,1]){
        const x = s*hw;
        g.fillStyle = c.base; g.strokeStyle = c.esc; g.lineWidth = 1.1;
        for (let i=0;i<5;i++){
          const yy = y0 + i*3.6, xx = x + s*(i*.35);
          g.beginPath(); g.ellipse(xx + (i%2 ? .6 : -.6)*s, yy, 2.4, 2.1, (i%2 ? .5 : -.5)*s, 0, PI*2); g.fill(); g.stroke();
        }
        // laço/elástico e pontinha
        const ye = y0 + 5*3.6 - 1.2, xe = x + s*1.8;
        g.beginPath(); g.moveTo(xe-1.6, ye+1); g.lineTo(xe, ye+5); g.lineTo(xe+1.6, ye+1); g.closePath(); g.fill(); g.stroke();
        g.fillStyle = k.c.roupa; g.strokeStyle = k.dark; g.lineWidth = 1;
        g.beginPath(); g.ellipse(xe, ye, 2.1, 1.3, 0, 0, PI*2); g.fill(); g.stroke();
      }
      capa(g, k, 4);
      // risca no meio
      g.strokeStyle = c.esc; g.lineWidth = 1;
      g.beginPath(); g.moveTo(0, k.top+.2); g.lineTo(0, k.top+3.5); g.stroke();
      brilho(g, k, -5, k.top+2.2, -3, k.top+.6, -1.5, k.top+.9, 1);
      brilho(g, k, 1.5, k.top+.9, 3, k.top+.6, 5, k.top+2.2, 1);
    }
  };

  // 6) Topete: onda alta na frente, inclinada para onde o herói olha
  EXTRA.cabelo.x_topete = {
    label: 'Topete',
    draw(g, k){
      const c = cores(k), f = k.f, t = k.top;
      capa(g, k, 4);
      g.fillStyle = c.base; g.strokeStyle = c.esc; g.lineWidth = 1.3;
      g.beginPath();
      g.moveTo(-f*8, t+4);
      g.quadraticCurveTo(-f*8, t-3, -f*2, t-5);
      g.quadraticCurveTo(f*6, t-7.5, f*11, t-2.5);
      g.quadraticCurveTo(f*11.5, t+1.5, f*8, t+.5);
      g.quadraticCurveTo(f*9.5, t+2, f*8.8, t+4.5);
      g.quadraticCurveTo(f*1, t+1, -f*8, t+4);
      g.closePath(); g.fill(); g.stroke();
      // ondas
      g.strokeStyle = c.esc; g.lineWidth = .9;
      g.beginPath(); g.moveTo(-f*4.5, t+1); g.quadraticCurveTo(f*1, t-3.5, f*8, t-1.5); g.stroke();
      brilho(g, k, -f*5, t-2, f*0, t-5, f*6, t-4.5, 1.3);
    }
  };

  // 7) Espetado estilo anime: pontas grandes pra todo lado
  EXTRA.cabelo.x_anime = {
    label: 'Espetado anime',
    draw(g, k){
      const c = cores(k), f = k.f;
      const cx = 0, cy = k.block ? k.cy-3 : k.cy-2.5, r0 = k.block ? 10 : 8.5;
      // espetos em volta do topo (mais longos pra trás)
      const spikes = [
        [PI*.95, 9],[PI*1.08, 11],[PI*1.22, 12],[PI*1.38, 12],[PI*1.52, 13],
        [PI*1.66, 11],[PI*1.8, 10],[PI*1.93, 8],[PI*2.04, 6.5],
      ];
      const pts = [];
      for (let i=0;i<spikes.length;i++){
        const [a,L] = spikes[i];
        const aa = f>0 ? PI*3 - a : a; // espelha: pontas longas vão para trás
        const a2 = aa + (f>0 ? -1 : 1)*PI*.07;
        pts.push([cx+Math.cos(aa)*r0, cy+Math.sin(aa)*r0*.9]);
        pts.push([cx+Math.cos(a2)*(r0+L), cy+Math.sin(a2)*(r0+L)*.85]);
      }
      g.fillStyle = c.base; g.strokeStyle = c.esc; g.lineWidth = 1.3;
      g.beginPath();
      g.moveTo(pts[0][0], pts[0][1]);
      for (const p of pts) g.lineTo(p[0], p[1]);
      // volta pela testa com franjinhas pontudas
      const fy = k.block ? k.top+5 : k.cy-4.5, hw = k.block ? 9.5 : 8.2;
      const x0 = pts[pts.length-1][0] > 0 ? 1 : -1;
      g.lineTo(x0*hw, fy-1);
      const n = 5;
      for (let i=1;i<=n;i++){
        const xa = x0*hw - x0*(2*hw)*(i-.5)/n, xb = x0*hw - x0*(2*hw)*i/n;
        g.lineTo(xa, fy + 1.6); g.lineTo(xb, fy - 1.2);
      }
      g.closePath(); g.fill(); g.stroke();
      // brilho
      brilho(g, k, -f*4, cy-6, f*0, cy-9, f*4, cy-7.5, 1.4);
    }
  };
})();

// altura do pescoço (onde o tronco encontra a cabeça)
function xCaNeckY(k){ return k.block ? -27 : -24.5; }

EXTRA.acessorio.x_capa = {
  label: 'Capa esvoaçante',
  back(g, k){
    const f = k.f, det = k.det, ny = xCaNeckY(k);
    const w = Math.sin(k.t*4) * 1.5;
    g.fillStyle = det; g.strokeStyle = k.shade(det, -.45); g.lineWidth = 1.6;
    // capa desenhada do lado de trás (-f) e ondulando
    const bx = -f;
    g.beginPath(); g.moveTo(f*7, ny); g.lineTo(bx*7, ny);
    g.quadraticCurveTo(bx*15, -14, bx*19 + w, -3);
    g.quadraticCurveTo(bx*14, -1 + w*.5, bx*10, -4);
    g.quadraticCurveTo(bx*5, -1, 0, -4);
    g.quadraticCurveTo(f*6, -2, f*9, -4);
    g.quadraticCurveTo(f*9, -16, f*7, ny);
    g.closePath(); g.fill(); g.stroke();
    // forro
    g.fillStyle = k.shade(det, -.3);

EXTRA.acessorio.x_cachecol = {

    g.quadraticCurveTo(b*9, ny + 5, b*3, ny + 4); g.closePath(); g.fill(); g.stroke();
    // listras na ponta
    g.strokeStyle = risca; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(b*10.5, ny + 2.6); g.lineTo(b*9, ny + 5.3); g.moveTo(b*13, ny + 4.5 + w); g.lineTo(b*11, ny + 7 + w); g.stroke();

EXTRA.acessorio.x_tapa_olho = {

// Poderes extras do Criador de Skins — Chaves e Poções
// Só usa o objeto API recebido em use(API).
(function(){
  // gira o vetor (dx,dy) em 'a' radianos
  function rot(dx, dy, a){ const c = Math.cos(a), s = Math.sin(a); return [dx*c - dy*s, dx*s + dy*c]; }
  // atira em leque: n projéteis espalhados em 'abertura' radianos
  function leque(API, n, abertura, o){
    for (let i = 0; i < n; i++){
      const a = n > 1 ? -abertura/2 + abertura*i/(n-1) : 0;
      const d = rot(API.P.dx, API.P.dy, a);
      API.shoot(Object.assign({dx:d[0], dy:d[1]}, o));
    }
  }
  // desenha um círculo no mundo (x,y em blocos, z em blocos)
  function bola(g, API, x, y, z, r, cor, alpha){
    const p = API.iso(x, y);
    g.save(); g.globalAlpha = alpha == null ? 1 : alpha;
    g.fillStyle = cor; g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(p[0], p[1] - z*API.ZPX, r, 0, Math.PI*2); g.fill(); g.stroke();
    g.restore();
  }
  // elipse no chão
  function anel(g, API, x, y, r, cor, alpha, larg){
    const p = API.iso(x, y);
    g.save(); g.globalAlpha = alpha == null ? 1 : alpha;
    g.strokeStyle = cor; g.lineWidth = larg || 3;
    g.beginPath(); g.ellipse(p[0], p[1], r*32*1.414, r*16*1.414, 0, 0, Math.PI*2); g.stroke();
    g.restore();
  }
  // marca no chão que some aos poucos
  function marca(API, x, y, r, cor, dur){ API.over(dur, null, null, (g, API, k) => anel(g, API, x, y, r*(.3 + .7*k), cor, 1 - k, 3)); }
  function matar(API, e, cor){ API.burst(e.x, e.y, 20, cor, 10, 3); API.kill(e); }

  // 1 — shape star, leque
  POWERS.p_leque_de_estrelas = {

      leque(API, 5, 1.0, {shape:'star', color:'#ffd84a', speed:11, range:5, size:.8});

  if (!musInv){ const g = AC.createGain(); g.connect(AC.destination); musInv = {g, next:AC.currentTime + .05}; }

function buildLevel(i){

  W = L.w || 24; H = L.h || 15; CX = W/2; CY = H/2;
  if (L.world){ buildWorld(L); return; }

  const y0 = Math.floor((H-L.width)/2), y1 = y0 + L.width - 1;
  S.box = {y0, y1, d:L.depth};
  const lava = (x,y) => { if (x>=0&&x<W&&y>=0&&y<H){ tiles[y][x]=1; tiles[y][W-1-x]=1; } };
  for (let x=0;x<L.depth;x++) for (let y=y0;y<=y1;y++) lava(x,y);
  if (L.arc) for (let y=6;y<=8;y++) lava(L.depth,y);
  const pud = [[7,3],[7,10]];
  for (let k=0;k<L.puddles;k++){ const [px,py]=pud[k]; lava(px,py); lava(px+1,py); lava(px,py+1); lava(px+1,py+1); }
  lavaTiles = []; arenaTiles = []; grassTiles = [];
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    if (tiles[y][x]===0 && Math.hypot(x+.5-CX, y+.5-CY) < ARENA_R) tiles[y][x] = 2;
    const t = tiles[y][x];
    (t===1 ? lavaTiles : t===2 ? arenaTiles : grassTiles).push([x,y]);
  }
  // baús na borda (fases mais altas têm mais baús)
  const nBau = L.chests + Math.floor(((S.fase||1)-1)/2);
  const cand = [];
  for (let x=L.depth+1; x<=W-L.depth-2; x++){ if (x===11||x===12) continue; cand.push([x,0],[x,H-1]); }
  for (let y=0;y<H;y++) if (y<=y0-2 || y>=y1+2) cand.push([0,y],[W-1,y]);
  shuffle(cand);
  const chosen = [];
  for (const c of cand){
    if (tiles[c[1]][c[0]]!==0) continue;
    if (chosen.every(o => Math.abs(o[0]-c[0])+Math.abs(o[1]-c[1]) >= 4)) chosen.push(c);
    if (chosen.length===nBau) break;
  }
  chests = chosen.slice(0, nBau).map(([x,y]) => ({x:x+.5, y:y+.5, open:false, openT:0, nokeyT:0}));

  for (let k=0;k<q.length-1;k++) q[k] = ['key', q[k][0]];  // chave inicial + chaves dos baús = todos os baús
  S.queue = q; S.opened = 0;
  // chaves soltas no mapa
  fieldKeys = [];
  for (let k=0;k<L.fieldKeys;k++) spawnFieldKey(i>0 && k===0);
  items = []; lashes = []; grab = null; particles = []; S.efire = [];
  frozenT.clear(); timeStop = 0; ptimers = []; S.ultraMult = 1; S.glacial = 0;
  spawnEnemies();
  spawnLamberys();
}

  function cintila(g, x, y, s, cor){ // brilhinho em cruz
    g.strokeStyle = cor || BRANCO; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x - s, y); g.lineTo(x + s, y); g.moveTo(x, y - s); g.lineTo(x, y + s); g.stroke();
  }
  function circ(g, x, y, r, cor, lw){ g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = cor; g.fill(); g.strokeStyle = OL; g.lineWidth = lw || 1.5; g.stroke(); }
  function olho(g, x, y, r){ circ(g, x, y, r, '#fff', 1); g.fillStyle = OL; g.beginPath(); g.arc(x + r * .25, y + r * .1, r * .55, 0, TAU); g.fill(); }
  function nuvem(g, x, y, s, cor){
    g.fillStyle = cor || BRANCO; g.strokeStyle = OL; g.lineWidth = 1.5;
    const bolas = [[-1, .2, .7], [-.4, -.35, .8], [.35, -.3, .75], [1, .2, .65], [0, .25, .8]];
    g.beginPath(); for (const [bx, by, br] of bolas){ g.moveTo(x + bx * s + br * s, y + by * s); g.arc(x + bx * s, y + by * s, br * s, 0, TAU); }
    g.stroke(); g.beginPath(); for (const [bx, by, br] of bolas){ g.moveTo(x + bx * s + br * s, y + by * s); g.arc(x + bx * s, y + by * s, br * s, 0, TAU); } g.fill();
  }
  function cristalPonta(g, x, y, w, h, cor, cor2){
    g.beginPath(); g.moveTo(x - w, y); g.lineTo(x - w, y - h * .7); g.lineTo(x, y - h); g.lineTo(x + w, y - h * .7); g.lineTo(x + w, y); g.closePath();
    g.fillStyle = cor; g.fill(); g.strokeStyle = OL; g.lineWidth = 1.5; g.stroke();
    g.beginPath(); g.moveTo(x, y - h); g.lineTo(x, y); g.lineTo(x + w, y); g.lineTo(x + w, y - h * .7); g.closePath(); g.fillStyle = cor2; g.fill();
    g.strokeStyle = OL; g.lineWidth = 1; g.beginPath(); g.moveTo(x, y - h); g.lineTo(x, y); g.stroke();
  }
  function losango(g, R, cor, borda){
    g.beginPath(); g.ellipse(0, 0, R * 45, R * 22.6, 0, 0, TAU); g.fillStyle = cor; g.fill();
    if (borda){ g.strokeStyle = borda; g.lineWidth = 2; g.stroke(); }
  }

  let tot = pool.reduce((a,[,w]) => a+w, 0), r = Math.random()*tot;
  for (const [k,w] of pool){ r -= w; if (r<=0) return k; }
  return pool[0][0];
}
function pigHit(g, byRobot){
  g.hits = (g.hits||0) + 1;
  if (g.hits>=3){
    g.dead = true;
    if (g.item) drops.push({x:g.x + rnd(-.3,.3), y:g.y + rnd(-.3,.3), res:g.item, t:0});
    drops.push({x:g.x, y:g.y, res:'file', t:0});
    floaters.push({x:g.x, y:g.y, text:'O Piggy deixou um Filé quadrado!', col:'#ffb3a0', t:1.6});
    burst(g.x, g.y, 12, '#ffffff', 18, 140); burst(g.x, g.y, 12, '#f7b6c2', 12, 120); tone(500,.2,'square',.05,-300);
    if (g.pen==null) setTimeout(() => respawnPiggy(regionAt(g.x,g.y)===1 ? 1 : 0), 120000);
    return;
  }
  if (g.item){ drops.push({x:g.x + rnd(-.3,.3), y:g.y + rnd(-.3,.3), res:g.item, t:0}); floaters.push({x:g.x, y:g.y, text:'Oinc! Largou ' + RES[g.item].nome, col:'#ffb3c6', t:1.4}); g.item = null; g.regrow = rnd(70,110); }
  else floaters.push({x:g.x, y:g.y, text:'Oinc!', col:'#ffb3c6', t:1});
  g.state = 'flee'; g.flee = 4; g.startle = .5; if (g.pen==null) g.lure = null; tone(900,.12,'square',.05,500); tone(1200,.15,'square',.04,300,.1);
  burst(g.x, g.y, 12, '#ffd6e0', 10, 110);
}
function hitPiggy(cx, cy, reach){
  let hit = false;
  for (const g of piggys){ if (g.dead || Math.hypot(g.x-cx, g.y-cy) > reach) continue; hit = true; pigHit(g); }
  return hit;
}

  penTile = Array.from({length:H}, () => new Array(W).fill(false));
  for (const p of SV.pens) for (let y=p.y0; y<p.y0+p.h; y++) for (let x=p.x0; x<p.x0+p.w; x++) if (penTile[y]) penTile[y][x] = true;
}
function spawnPenPiggy(i){

  piggys.push({pen:i, x:p.x0+.6+Math.random()*(p.w-1.2), y:p.y0+.6+Math.random()*(p.h-1.2), face:Math.random()<.5?1:-1, dx:Math.cos(a), dy:Math.sin(a), t:rnd(.5,2.5), state:'wander', ph:Math.random()*6, item:piggyItem(regionAt(p.x0,p.y0)===1 ? 1 : 0), regrow:0, flee:0, hits:0});
}
function placePen(){
  const cx = P.x + P.dx*4.2, cy = P.y + P.dy*4.2, x0 = Math.floor(cx-3.5), y0 = Math.floor(cy-2.5), w = 7, h = 5;
  for (let y=y0-1; y<=y0+h; y++) for (let x=x0-1; x<=x0+w; x++) if (tileAt(x+.5,y+.5)!==0 || x<1 || y<1 || x>=W-1 || y>=H-1) return null;
  if (SV.pens.some(o => x0 < o.x0+o.w+1 && o.x0 < x0+w+1 && y0 < o.y0+o.h+1 && o.y0 < y0+h+1)) return null;
  if (P.x > x0-.3 && P.x < x0+w+.3 && P.y > y0-.3 && P.y < y0+h+.3) return null;
  return {x0, y0, w, h, n:0};
}
function updatePens(dt){
  SV.pens.forEach((p, i) => {
    const n = piggys.filter(g => g.pen===i && !g.dead).length;
    p.n = n;
    const gx = p.x0+3.5, gy = p.y0+p.h+.9;
    for (const g of piggys){
      if (n + piggys.filter(o => o.lure===i && !o.dead).length >= 60) break;
      if (g.dead || g.pen!=null || g.lure!=null || g.state==='flee') continue;
      if (Math.hypot(g.x-gx, g.y-gy) > 18) continue;
      g.lure = i; floaters.push({x:g.x, y:g.y, text:'Oinc? Um chiqueiro!', col:'#ffd6e0', t:1.3});
    }
  });
  // de vez em quando aparece um Piggy solto longe do jogador
  S.pigT = (S.pigT||0) + dt;
  if (S.pigT > 12){
    S.pigT = 0;
    if (piggys.filter(g => g.pen==null && !g.dead).length < 50){
      const land = grassTiles.filter(([x,y]) => !(penTile && penTile[y][x]) && Math.hypot(x+.5-P.x, y+.5-P.y) > 10);
      if (land.length){ const [x,y] = land[Math.floor(Math.random()*land.length)], a = Math.random()*Math.PI*2;

    }

}
function penFenceSegs(p){
  const segs = [], gx = p.x0 + 3;
  for (let x=p.x0; x<p.x0+p.w; x++){ segs.push([x, p.y0, x+1, p.y0]); if (x!==gx) segs.push([x, p.y0+p.h, x+1, p.y0+p.h]); }
  for (let y=p.y0; y<p.y0+p.h; y++){ segs.push([p.x0, y, p.x0, y+1]); segs.push([p.x0+p.w, y, p.x0+p.w, y+1]); }
  return segs;
}

function respawnPiggy(reg){
  if (!S.L || !S.L.world) return;
  const land = grassTiles.filter(([x,y]) => (region[y]||[])[x]===reg && Math.hypot(x+.5-P.x, y+.5-P.y) > 8);
  if (!land.length) return;
  const [x,y] = land[Math.floor(Math.random()*land.length)], a = Math.random()*Math.PI*2;
  piggys.push({x:x+.5, y:y+.5, face:1, dx:Math.cos(a), dy:Math.sin(a), t:rnd(1,3), state:'wander', ph:Math.random()*6, item:piggyItem(reg), regrow:0, flee:0, hits:0});
}
function updatePiggys(dt){
  piggys = piggys.filter(g => !g.dead);
  for (const g of piggys){
    g.ph += dt; g.t -= dt;
    let vx = 0, vy = 0;
    if (g.state==='flee' && g.startle>0){
      // pulo de susto: fica parado no ar com os olhos esticados
      g.startle -= dt; g.jz = Math.sin((1 - Math.max(0, g.startle)/.5) * Math.PI) * 16;
    } else if (g.state==='flee'){
      g.jz = 0; g.flee -= dt;
      const dx = g.x-P.x, dy = g.y-P.y, d = Math.hypot(dx,dy) || 1;
      if (g.pen!=null && g.fdx!=null){ vx = g.fdx*7.5; vy = g.fdy*7.5; } else { vx = dx/d*7.5; vy = dy/d*7.5; }
      if (Math.random() < dt*12) burst(g.x, g.y, 2, 'rgba(230,220,200,.8)', 2, 40, 60, 2);
      if (g.flee<=0){ g.state = 'wander'; g.t = 0; g.fdx = g.fdy = null; }
    } else if (g.lure!=null && penOf(g.lure)){
      const p = penOf(g.lure), gx = p.x0+3.5, gyOut = p.y0+p.h+.9;
      let tx, ty, entrando = false;
      const foraX = g.x < p.x0-.6 || g.x > p.x0+p.w+.6;
      if (g.entrando){ tx = gx; ty = p.y0+p.h-1.2; entrando = true; }
      else if (g.y < p.y0+p.h+.6){
        // está atrás ou do lado: primeiro sai pela lateral, depois desce até a frente
        if (!foraX){ tx = g.x < gx ? p.x0-1.3 : p.x0+p.w+1.3; ty = g.y; }
        else { tx = g.x; ty = gyOut + .2; }
      } else if (Math.hypot(g.x-gx, g.y-gyOut) > .3){ tx = gx; ty = gyOut; }
      else { g.entrando = true; tx = gx; ty = p.y0+p.h-1.2; entrando = true; }
      const dx = tx-g.x, dy = ty-g.y, d = Math.hypot(dx,dy) || 1;
      vx = dx/d*1.6; vy = dy/d*1.6;
      if (inPen(p, g.x, g.y, .3)){ g.pen = g.lure; g.lure = null; g.entrando = false; burst(g.x, g.y, 8, '#f7b6c2', 6, 60); }
      else if (entrando){ g.x += vx*dt; g.y += vy*dt; g.moving = true; if (Math.abs(vx-vy) > .01) g.face = (vx-vy) > 0 ? 1 : -1; continue; }
    } else {
      if (g.t<=0){ const a = Math.random()*Math.PI*2; g.dx = Math.cos(a); g.dy = Math.sin(a); g.t = rnd(1.5,3.5); if (Math.random()<.35){ g.dx = g.dy = 0; } }
      vx = g.dx*.7; vy = g.dy*.7;
      if (!g.item){ g.regrow -= dt; if (g.regrow<=0){ g.item = piggyItem(regionAt(g.x,g.y)===1 ? 1 : 0); } }
    }
    let nx = g.x + vx*dt, ny = g.y + vy*dt;
    const pp = g.pen!=null ? penOf(g.pen) : null;
    const bad = pp ? (x,y) => !inPen(pp, x, y, .3) : (x,y) => x<.4 || y<.4 || x>W-.4 || y>H-.4 || tileAt(x,y)===1 || tileAt(x,y)===4 || (penTile && penTile[Math.floor(y)] && penTile[Math.floor(y)][Math.floor(x)]);
    if (bad(nx,ny)){
      if (!bad(nx,g.y)) ny = g.y; else if (!bad(g.x,ny)) nx = g.x;
      else {
        // encurralado: tenta escapar pelos lados
        const side = (g.ph*7|0)%2 ? 1 : -1, ax = g.x - vy*side*dt, ay = g.y + vx*side*dt;
        if (!bad(ax,ay)){ nx = ax; ny = ay; } else { nx = g.x; ny = g.y; g.t = 0; if (g.state==='flee'){ const a = Math.random()*Math.PI*2; g.fdx = Math.cos(a); g.fdy = Math.sin(a); } }
      }
    }
    if (Math.abs((nx-g.x)-(ny-g.y)) > .0005) g.face = ((nx-g.x)-(ny-g.y)) > 0 ? 1 : -1;
    g.moving = Math.hypot(nx-g.x, ny-g.y) > .001; g.x = nx; g.y = ny;
  }
  for (const d of drops){
    d.t += dt;
    if (Math.hypot(P.x-d.x, P.y-d.y) < .65 && P.z < .9){ d.got = true; addRes(d.res, 1, d.x, d.y); tone(990,.08,'square',.05); updHUD(); }
  }
  drops = drops.filter(d => !d.got);
}

    const land = grassTiles.filter(([tx,ty]) => (region[ty]||[])[tx]===reg && !(penTile && penTile[ty][tx]) && Math.hypot(tx+.5-P.x, ty+.5-P.y) > 4);

function hitChick(cx, cy, reach){

function pascoa(y){
  const a = y%19, b = Math.floor(y/100), c = y%100, d = Math.floor(b/4), e = b%4, f = Math.floor((b+8)/25), g = Math.floor((b-f+1)/3);

}

// ---------- partículas ----------
function burst(wx, wy, z, color, n, spd=120, g=260, size=3){
  const [sx,sy] = iso(wx,wy);
  for (let k=0;k<n;k++){
    const a = Math.random()*Math.PI*2, v = Math.random()*spd;
    const life = rnd(.5,1);
    particles.push({x:sx, y:sy-z, vx:Math.cos(a)*v, vy:Math.sin(a)*v*.6 - spd*.5, g, life, max:life, c:color, s:size*rnd(.6,1.3)});
  }
}

// ---------- mecânicas ----------
function nearestLava(x, y){
  let best = null, bd = 1e9;
  for (const [i,j] of lavaTiles){ const d = (i+.5-x)**2 + (j+.5-y)**2; if (d<bd){ bd = d; best = {x:i+.5, y:j+.5}; } }
  return {p:best, d:Math.sqrt(bd)};
}
function die(){
  if (P.dead) return;
  if (P.mount){ const l = P.mount; P.mount = null; P.fly = 0; if (!l.form){ l.state = 'idle'; placeLambery(l); } }
  P.dead = true; P.deadT = 1; arenaT = 0; SFX.sizzle();
  burst(P.x, P.y, 6, S.L.haz.bub[1], 26, 150); burst(P.x, P.y, 6, S.L.haz.bub[0], 14, 110);
}

    burst(P.x, P.y, 24, '#c07bff', 24, 140); toast(`O escudo te salvou do ${S.L.perigo}!`.replace('do lava','da lava').replace('do água','da água').replace('do gosma','da gosma'));
  } else die();
}
function startGrab(fromX, fromY, phase){
  zip = null; dismount('rest');
  grab = {ox:fromX, oy:fromY, hx:fromX, hy:fromY, phase, t:0, dur:clamp(Math.hypot(P.x-fromX,P.y-fromY)/14,.35,.8)};
  if (phase==='drag') contact();
}
function contact(){
  grab.t = 0; grab.hx = P.x; grab.hy = P.y;
  if (eff.shield || P.star>0){
    if (!(P.star>0)) eff.shield = false; grab.phase = 'recoil'; grab.rx = P.x; grab.ry = P.y;
    P.inv = 1.5; arenaT = 0; SFX.shield(); burst(P.x, P.y, 26, '#c07bff', 28, 160);
    toast(P.star>0 ? 'Invencível! A língua não te pega.' : 'O escudo queimou a língua! Pule rápido.');
  } else {
    grab.phase = 'drag'; grab.sx = P.x; grab.sy = P.y;
    grab.dur = Math.max(.7, Math.hypot(P.x-grab.lx, P.y-grab.ly)/9); SFX.slurp();
  }
}
function updateGrab(dt){
  const g = grab; g.t += dt;
  if (g.phase==='reach'){
    const k = Math.min(1, g.t/g.dur), e = 1-(1-k)**3;
    g.hx = g.ox + (P.x-g.ox)*e; g.hy = g.oy + (P.y-g.oy)*e;
    if (k>=1) contact();
  } else if (g.phase==='drag'){
    const k = Math.min(1, g.t/g.dur), e = k*k*(3-2*k);
    P.x = g.sx + (g.lx-g.sx)*e; P.y = g.sy + (g.ly-g.sy)*e; P.z = Math.sin(k*Math.PI)*1.1;
    g.hx = P.x; g.hy = P.y;
    if (k>=1){ grab = null; P.z = 0; P.x = g.lx; P.y = g.ly; die(); }
  } else {
    const k = Math.min(1, g.t/.45);
    g.hx = g.rx + (g.ox-g.rx)*k; g.hy = g.ry + (g.oy-g.ry)*k;
    if (k>=1) grab = null;
  }
}
function updateLashes(dt){
  for (const l of lashes){
    l.t += dt;
    if (l.phase==='warn' && l.t>=.85){ l.phase = 'strike'; l.t = 0; }
    else if (l.phase==='strike'){
      const k = Math.min(1, l.t/.16);
      l.hx = l.ox + (l.tx-l.ox)*k; l.hy = l.oy + (l.ty-l.oy)*k;
      if (k>=1){
        if (!grab && !P.dead && S.mode==='play' && Math.hypot(P.x-l.tx, P.y-l.ty) < .7 && P.z < .3){
          l.done = true; startGrab(l.ox, l.oy, 'drag');
        } else { l.phase = 'retract'; l.t = 0; }
      }
    } else if (l.phase==='retract'){
      const k = Math.min(1, l.t/.35);
      l.hx = l.tx + (l.ox-l.tx)*k; l.hy = l.ty + (l.oy-l.ty)*k;
      if (k>=1) l.done = true;
    }
  }
  lashes = lashes.filter(l => !l.done);
}
function openChest(c){
  c.open = true; c.openT = 0; P.keys--; S.opened++;
  const content = c.content || S.queue.shift() || ['veneno'];
  content.forEach((kind,n) => items.push({kind, x:c.x, y:c.y, t:-n*.25}));

}
function applyItem(kind){

}

// ---------- robôs dos heróis ----------
const ROBOS = {
  caio:   {nome:'Caracol-Robô', desc:'caracol robô azul de uma roda que corre e atropela inimigos'},
  gloower:{nome:'Lesma-Trator', desc:'lesma robô de esteira de trator com laser no olho'},
  barry:  {nome:'Barata-Trator', desc:'barata robô de esteira com dois lasers nas antenas'},
};
let robot = null;
const RMODES = {guarda:'Guarda-costas', coletor:'Coletor', porco:'Mata-porco', explorar:'Observar a ilha'};
const makeRobot = (x, y, mode) => ({kind:ROBOS[S.skin] ? S.skin : 'gloower', x, y, face:1, t:2, state:'follow', beams:[], spin:0, ph:Math.random()*6, mode});
function spawnRobot(){
  const SP = S.spawn || {x:CX, y:CY};
  if (S.L && S.L.world){
    robot = null;
    if (SV.robot && !(SV.robots||[]).length) SV.robots = [{mode:'guarda'}];
    robots = (SV.robots||[]).map((r, i) => makeRobot(SP.x-1.2 + (i%3)*.7, SP.y+1.2 + Math.floor(i/3)*.7, r.mode||'guarda'));
    return;
  }
  robot = ROBOS[S.skin] ? {kind:S.skin, x:SP.x-1.2, y:SP.y+1.2, face:1, t:2, state:'follow', beams:[], spin:0, ph:0} : null;
}
function moveRobotTo(r, tx, ty, sp, dt){
  const dx = tx-r.x, dy = ty-r.y, raw = Math.hypot(dx,dy);
  if (raw < 1e-6) return 0;   // já chegou
  const st = Math.min(raw, sp*dt);
  r.x += dx/raw*st; r.y += dy/raw*st; r.spin += st*3;
  if (Math.abs(dx-dy) > .05) r.face = (dx-dy) > 0 ? 1 : -1;
  return raw;
}
function updateRobotMode(r, dt){
  if (S.mode!=='play') return;
  if (r.mode==='guarda' || !r.mode){ updateRobot(dt, r); return; }
  r.ph += dt; r.t -= dt;
  for (const b of r.beams) b.t -= dt;
  r.beams = r.beams.filter(b => b.t>0);
  const segue = () => { const fx = P.x - P.dx*1.5, fy = P.y - P.dy*1.5; if (Math.hypot(fx-r.x, fy-r.y) > .3) moveRobotTo(r, fx, fy, 6, dt); };
  if (r.mode==='coletor'){
    if (!r.alvo || r.alvo.gone || !nodes.includes(r.alvo)){
      let best = null, bd = 16;
      for (const n of nodes){ if (n.gone) continue; const d = Math.hypot(n.x-r.x, n.y-r.y) + Math.hypot(n.x-P.x, n.y-P.y)*.5; if (d<bd){ bd = d; best = n; } }
      r.alvo = best;
    }
    if (!r.alvo){ segue(); return; }
    moveRobotTo(r, r.alvo.x - .6, r.alvo.y + .2, 4.5, dt);
    if (Math.hypot(r.alvo.x - r.x, r.alvo.y - r.y) < 1.1 && r.t<=0){
      r.t = .55; const n = r.alvo, nd = NODE[n.type];
      n.hp -= 1; n.shake = 1; burst(n.x, n.y, 14, RES[nd.res].cor, 6, 80); tone(320,.06,'square',.03,-60);
      if (n.hp<=0){ n.gone = true; SV.harvested[n.id] = SV.wt + rnd(80,130); addRes(nd.res, nd.n, n.x, n.y); r.alvo = null; updHUD(); }
    }
  } else if (r.mode==='porco'){
    for (const dr of drops){ if (!dr.got && Math.hypot(dr.x-r.x, dr.y-r.y) < .8){ dr.got = true; addRes(dr.res, 1, dr.x, dr.y); updHUD(); } }
    if (!r.alvo || r.alvo.dead || !piggys.includes(r.alvo)){
      let best = null, bd = 20;
      for (const g of piggys){ if (g.dead) continue; const d = Math.hypot(g.x-r.x, g.y-r.y); if (d<bd){ bd = d; best = g; } }
      r.alvo = best;
    }
    const sobra = drops.find(dr => !dr.got && Math.hypot(dr.x-r.x, dr.y-r.y) < 8);
    if (sobra && (!r.alvo || r.alvo.state==='flee')){ moveRobotTo(r, sobra.x, sobra.y, 7, dt); return; }
    if (!r.alvo){ segue(); return; }
    moveRobotTo(r, r.alvo.x, r.alvo.y, 8.5, dt);
    if (Math.hypot(r.alvo.x - r.x, r.alvo.y - r.y) < .9 && r.t<=0){ r.t = .45; pigHit(r.alvo, true); if (r.alvo.dead) r.alvo = null; }
  } else if (r.mode==='explorar'){
    if (!r.goal || Math.hypot(r.goal.x-r.x, r.goal.y-r.y) < .5 || (r.goalT = (r.goalT||0)+dt) > 25){
      const [x,y] = grassTiles[Math.floor(Math.random()*grassTiles.length)]; r.goal = {x:x+.5, y:y+.5}; r.goalT = 0;
    }
    moveRobotTo(r, r.goal.x, r.goal.y, 5, dt);
    for (const L of (S.landmarks||[])){
      if (L.found || Math.hypot(L.x-r.x, L.y-r.y) > L.raio + 2) continue;
      L.found = true; (SV.found ||= []).push(L.id); saveAdv();
      toast(`O robô explorador encontrou: ${WX.landmarks[L.key].nome}! Ele aparece no minimapa.`); tone(880,.15,'triangle',.06);
    }
  }
}
function fireLaser(r, e, x, y, i=0){
  const tx = e ? e.x : x, ty = e ? e.y : y;
  r.beams.push({tx, ty, tz: e ? (e.boss ? BOSS_MOUTH*.45 : .5) : P.z+.6, t:.3, i});
  if (e) killEnemy(e, 2);
  burst(tx, ty, 14, r.kind==='gloower' ? '#ff3b3b' : '#8f7dff', 10, 120);
  tone(r.kind==='gloower' ? 1400 : 1700, .12, 'sawtooth', .04, -900);
  const dd = (tx-r.x)-(ty-r.y); if (Math.abs(dd)>.05) r.face = dd>0 ? 1 : -1;
}
function updateRobot(dt, r=robot){
  if (!r || S.mode!=='play') return;
  r.ph += dt; r.t -= dt;
  for (const b of r.beams) b.t -= dt;
  r.beams = r.beams.filter(b => b.t>0);
  if (r.state==='ram'){
    const e = r.target, alive = e && !e.dead; r.rt -= dt;
    const tx = alive ? e.x : r.tx, ty = alive ? e.y : r.ty;
    const dx = tx-r.x, dy = ty-r.y, d = Math.hypot(dx,dy) || 1, step = 11*dt;
    r.x += dx/d*Math.min(step,d); r.y += dy/d*Math.min(step,d); r.spin += step*3;
    if (Math.abs(dx-dy)>.05) r.face = (dx-dy)>0 ? 1 : -1;
    if (r.tongue && grab && Math.hypot(grab.hx-r.x, grab.hy-r.y) < .9){ cutGrab('O Caracol-Robô'); r.state = 'follow'; }
    else if (alive && d < .6 + ext(e)){ killEnemy(e, 2); burst(r.x, r.y, 10, '#4fb3ff', 14, 120); tone(300,.1,'square',.05,-150); r.state = 'follow'; }
    else if (r.rt<=0 || d<.2) r.state = 'follow';
    return;
  }
  const fx = P.x - P.dx*1.3, fy = P.y - P.dy*1.3, dx = fx-r.x, dy = fy-r.y, d = Math.hypot(dx,dy);
  if (d>.15){ const sp = Math.min(d*3, 7.5); r.x += dx/d*sp*dt; r.y += dy/d*sp*dt; r.spin += sp*dt*3; if (Math.abs(dx-dy)>.05) r.face = (dx-dy)>0 ? 1 : -1; }
  if (d>9){ r.x = fx; r.y = fy; }
  r.x = clamp(r.x, .3, W-.3); r.y = clamp(r.y, .3, H-.3);
  if (r.t>0) return;
  const range = r.kind==='caio' ? 5 : 6.5;
  if (grab && Math.hypot(grab.hx-r.x, grab.hy-r.y) < range+2){
    if (r.kind==='caio'){ r.state = 'ram'; r.target = null; r.tx = grab.hx; r.ty = grab.hy; r.rt = .9; r.tongue = true; r.t = 3; }
    else { fireLaser(r, null, grab.hx, grab.hy); cutGrab(ROBOS[r.kind].nome==='Lesma-Trator' ? 'A Lesma-Trator' : 'A Barata-Trator'); r.t = 2.5; }
    return;
  }
  const alvos = enemies.filter(e => !e.dead && e.state!=='rise' && Math.hypot(e.x-r.x, e.y-r.y) < range + ext(e))
    .sort((a,b) => Math.hypot(a.x-r.x,a.y-r.y) - Math.hypot(b.x-r.x,b.y-r.y));
  if (!alvos.length) return;
  if (r.kind==='caio'){ r.state = 'ram'; r.target = alvos[0]; r.tx = alvos[0].x; r.ty = alvos[0].y; r.rt = 1; r.tongue = false; r.t = 4; tone(200,.2,'sawtooth',.04,300); }
  else if (r.kind==='gloower'){ fireLaser(r, alvos[0]); r.t = 3; }
  else { alvos.slice(0,2).forEach((e,i) => fireLaser(r, e, 0, 0, i)); r.t = 3.5; }
}
function drawTreads(spin, col){
  ctx.fillStyle = '#2b2b33'; ctx.strokeStyle = '#111116'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-13,-8,26,8,4) : ctx.rect(-13,-8,26,8); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#4a4a55'; ctx.lineWidth = 1;

function throwPoison(){

function enemyBlocked(e, nx, ny){
  if (nx<.3 || ny<.3 || nx>W-.3 || ny>H-.3) return true;
  if (tileAt(nx,ny)===4) return true;
  if (S.L.world && (S.cityColl||[]).some(c => Math.hypot(c.x-nx, c.y-ny) < c.r)) return true;
  if (S.L.world && darkness()>.5 && SV.builds.some(b => b.type==='muro' && Math.hypot(b.x-nx, b.y-ny) < .65)) return true;
  if (S.L.world && SV.builds.some(b => BUILDS[b.type] && BUILDS[b.type].bloqueia && Math.hypot(b.x-nx, b.y-ny) < .7)) return true;
  return !ENEMY[e.type].proof && tileAt(nx,ny)===1;
}
function moveEnemy(e, vx, vy, dt){
  const nx = e.x+vx*dt, ny = e.y+vy*dt;
  if (enemyBlocked(e,nx,ny)) return false;
  e.x = nx; e.y = ny;
  if (Math.abs(vx-vy) > .01) e.face = (vx-vy) > 0 ? 1 : -1;
  return true;
}
function updateBoss(e, dt){
  e.ph += dt; e.iframe = Math.max(0, e.iframe-dt);
  e.mouth += (((e.state==='tongue' || e.state==='breath') ? 1 : 0) - e.mouth) * Math.min(1, dt*8);
  if (e.state==='dying'){
    e.t -= dt;
    if (Math.random()<dt*25) burst(e.x+rnd(-1,1), e.y+rnd(-1,1), rnd(10,70), Math.random()<.5 ? '#6fbf4a' : '#ffd23f', 3, 120);
    if (e.t<=0 && !e.dead){ e.dead = true; burst(e.x, e.y, 30, '#ffd23f', 60, 260); burst(e.x, e.y, 30, '#6fbf4a', 40, 220); levelClear(); }
    return;
  }

    e.t -= dt;
    if (Math.random()<dt*30) burst(CX+rnd(-2.5,2.5), CY+rnd(-2.5,2.5), 4, Math.random()<.5 ? '#9d7bff' : '#6fbf4a', 2, 90);
    if (e.t<=0){ e.state = 'walk'; e.t = 1.5; toast('O Zambery saiu da arena! Derrote ele.'); shake(.6, 6); tone(70,.8,'sawtooth',.1,-30); }
    return;

    e.t -= dt*rage;
    if (e.t<=0 && !P.dead && !grab){
      const r = Math.random();
      if (dist<7 && r<.55){ e.state = 'stomp'; e.phase = 'crouch'; e.t = .45; }
      else if (r<.75){ e.state = 'tongue'; e.phase = 'warn'; e.t = .8/rage; e.tx = clamp(P.x,.5,W-.5); e.ty = clamp(P.y,.5,H-.5); e.hx = e.x; e.hy = e.y; SFX.warn(); }
      else { e.state = 'breath'; e.phase = 'warn'; e.t = .6; e.bx = ux; e.by = uy; }
    }
  } else if (e.state==='tongue'){
    e.t -= dt;
    if (e.phase==='warn' && e.t<=0){ e.phase = 'strike'; e.t = .22; SFX.slurp(); }
    else if (e.phase==='strike'){
      const k = 1 - Math.max(0,e.t)/.22; e.hx = e.x+(e.tx-e.x)*k; e.hy = e.y+(e.ty-e.y)*k;
      if (e.t<=0){
        if (!grab && !P.dead && Math.hypot(P.x-e.tx, P.y-e.ty) < .85 && P.z < .4 && P.inv<=0){
          const n = nearestLava(P.x,P.y).p || {x:e.x, y:e.y}; dismount('rest'); zip = null;
          grab = {ox:e.x, oy:e.y, oz:BOSS_MOUTH, hx:P.x, hy:P.y, phase:'reach', t:0, dur:.05, lx:n.x, ly:n.y};
          e.state = 'walk'; e.t = 3; toast('A língua do Zambery te pegou!');
        } else { e.phase = 'back'; e.t = .3; }
      }
    } else if (e.phase==='back'){
      const k = Math.max(0,e.t)/.3; e.hx = e.x+(e.tx-e.x)*k; e.hy = e.y+(e.ty-e.y)*k;
      if (e.t<=0){ e.state = 'walk'; e.t = rnd(1.8,2.8); }
    }
  } else if (e.state==='stomp'){
    e.t -= dt;
    if (e.phase==='crouch' && e.t<=0){ e.phase = 'air'; e.t = .8; e.sx = e.x; e.sy = e.y; e.jx = clamp(P.x,2,W-2); e.jy = clamp(P.y,2,H-2); tone(160,.3,'triangle',.06,200); }
    else if (e.phase==='air'){
      const k = 1 - Math.max(0,e.t)/.8; e.x = e.sx+(e.jx-e.sx)*k; e.y = e.sy+(e.jy-e.sy)*k; e.z = Math.sin(k*Math.PI)*4;

    }
  }
  if (!P.dead && !grab && S.mode==='play'){
    const d = Math.hypot(P.x-e.x, P.y-e.y);
    if (d<BOSS_SIZE-.7){
      if (P.z>1.1 && P.vz<0){ killEnemy(e, 2); P.vz = 7.5; }

    }
  }
}

function killEnemy(e, dmg=1, force=false){

function placeLambery(l){

    chests.every(c => Math.hypot(c.x-x-.5, c.y-y-.5) > 1.5));

  l.x = x+.5; l.y = y+.5;
}
function spawnLamberys(){
  lamberys = [];

function dismount(mode){
  const l = P.mount; if (!l) return;
  if (l.form){ P.mount = null; P.fly = 0; P.formT = 0; if (P.z>0 && P.vz===0) P.vz = -1; burst(P.x, P.y, 20, l.pal.body, 20, 140); if (mode==='scared') toast('O golpe desfez a transformação, mas você não perdeu vida!'); return; }
  P.mount = null; P.fly = 0;
  l.x = P.x; l.y = P.y;
  if (mode==='scared'){ l.state = 'scared'; l.t = 3; }
  else { l.state = 'rest'; l.t = 1.2; }
  if (P.z>0 && P.vz===0) P.vz = -1;
}
function lamMove(l, vx, vy, dt){
  const nx = l.x+vx*dt, ny = l.y+vy*dt;
  if (nx<.3 || ny<.3 || nx>W-.3 || ny>H-.3 || tileAt(nx,ny)===1 || tileAt(nx,ny)===4) return false;
  l.x = nx; l.y = ny; if (Math.abs(vx-vy)>.01) l.face = (vx-vy)>0 ? 1 : -1; return true;
}
function updateLamberys(dt){
  if (P.mount && P.mount.form){
    const l = P.mount; l.ph += dt; l.wings += ((P.fly>0?1:0) - l.wings) * Math.min(1, dt*8);
    l.x = P.x; l.y = P.y; l.face = P.face;
    P.formT -= dt; if (P.formT<=0){ dismount('rest'); toast('A transformação acabou.'); }
  }
  for (const l of lamberys){
    l.ph += dt;
    const flying = P.mount===l && P.fly>0;
    l.wings += ((flying?1:0) - l.wings) * Math.min(1, dt*8);
    if (P.mount===l){ l.x = P.x; l.y = P.y; l.face = P.face; continue; }
    l.t -= dt;
    if (l.state==='scared'){
      let ax = l.x-P.x, ay = l.y-P.y; const d = Math.hypot(ax,ay)||1;
      if (!lamMove(l, ax/d*3, ay/d*3, dt)) lamMove(l, -ay/d*3, ax/d*3, dt);
      if (l.t<=0) l.state = 'idle';
    } else {
      if (l.state==='rest' && l.t<=0) l.state = 'idle';
      if (l.t<=0){ const a = Math.random()*Math.PI*2; l.dx = Math.cos(a); l.dy = Math.sin(a); l.t = rnd(1.5,3); }
      if (!lamMove(l, l.dx*.6, l.dy*.6, dt)) l.t = 0;

function basicAttack(){

  if (P.atkCd>0 || P.dead) return;
  const A = (S.L.world && SV.arma) ? ARMAS[SV.arma] : null, reach = A ? A.alcance : 0;
  P.atkCd = .4; swing = {t:0, dx:P.dx, dy:P.dy, big:reach, col:A ? A.cor : null};
  const pk = powerOf(); tone(A ? 420 : pk==='gloower' ? 900 : 260, .12, A ? 'triangle' : pk==='gloower' ? 'sine' : 'sawtooth', .05, pk==='gloower' ? 400 : -120);
  const cx = P.x + P.dx*(.65+reach*.6), cy = P.y + P.dy*(.65+reach*.6);
  if (S.L.world && !hitPiggy(cx, cy, .95 + reach*.3) && !hitChick(cx, cy, .95 + reach*.3)) hitNodes(cx, cy, A ? A.coleta : 1, .95 + reach*.3);

}
function iceBreath(){
  if (P.breathCd>0 || P.dead) return;
  P.breathCd = 2.2;
  tone(1300,.45,'sine',.06,-800); tone(900,.35,'triangle',.04,-500,.05);
  const cosA = Math.cos(.6);
  const inCone = (x, y) => { const vx = x-P.x, vy = y-P.y, d = Math.hypot(vx,vy); return d<.4 || (d<=2.8 && (vx*P.dx+vy*P.dy)/d > cosA); };

  for (const e of enemies) if (!e.dead && inCone(e.x,e.y)){ e.frozen = 4; n++; burst(e.x, e.y, 14, '#dff6ff', 12, 90); }
  for (const [x,y] of lavaTiles){

  }
  if (n) toast(n>1 ? `O Lambery congelou ${n} inimigos!` : 'O Lambery congelou um inimigo!');
}

function updatePowers(dt){
